function haversine(a, b) {
  if (!a || !b) return Infinity;
  const R = 6371000, toR = (x) => x * Math.PI / 180;
  const dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

async function orsGeocode(address) {
  if (!address) return null;
  const url = `https://api.openrouteservice.org/geocode/search?api_key=${CONFIG.ORS_KEY}` +
    `&text=${encodeURIComponent(address)}&boundary.country=${CONFIG.GEOCODE_COUNTRY}&size=1`;
  try {
    const r = await fetch(url);
    const j = await r.json();
    const f = j.features && j.features[0];
    if (!f) return null;
    return { lng: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], label: f.properties && f.properties.label };
  } catch (e) { return null; }
}

async function orsOptimize(stops, profile, start) {
  // stops: [{lat,lng}] -> renvoie {order:[indices], distance, duration}
  const pts = stops.filter((s) => s.lat != null && s.lng != null);
  if (pts.length < 2) return { order: stops.map((_, i) => i), distance: null, duration: null };
  const s0 = start || [pts[0].lng, pts[0].lat];
  try {
    const body = {
      jobs: pts.map((s, i) => ({ id: i + 1, location: [s.lng, s.lat] })),
      vehicles: [{ id: 1, profile, start: s0, end: s0 }]
    };
    const r = await fetch('https://api.openrouteservice.org/optimization', {
      method: 'POST',
      headers: { Authorization: CONFIG.ORS_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const j = await r.json();
    const route = j.routes && j.routes[0];
    if (!route) throw new Error('no route');
    const order = route.steps.filter((st) => st.type === 'job').map((st) => st.job - 1);
    return { order, distance: route.distance, duration: route.duration };
  } catch (e) {
    // Fallback : plus proche voisin (haversine)
    const remaining = pts.map((_, i) => i);
    const order = [];
    let cur = { lat: s0[1], lng: s0[0] };
    while (remaining.length) {
      let best = 0, bestD = Infinity;
      remaining.forEach((idx, k) => { const d = haversine(cur, pts[idx]); if (d < bestD) { bestD = d; best = k; } });
      const idx = remaining.splice(best, 1)[0];
      order.push(idx); cur = pts[idx];
    }
    return { order, distance: null, duration: null, fallback: true };
  }
}

async function orsRoute(coords, profile) {
  // coords: [[lng,lat]...] -> renvoie polyline [[lat,lng]...]
  if (!coords || coords.length < 2) return null;
  try {
    const r = await fetch(`https://api.openrouteservice.org/v2/directions/${profile}/geojson`, {
      method: 'POST',
      headers: { Authorization: CONFIG.ORS_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ coordinates: coords })
    });
    const j = await r.json();
    const line = j.features && j.features[0] && j.features[0].geometry.coordinates;
    const sum = j.features && j.features[0] && j.features[0].properties.summary;
    if (!line) return null;
    return { line: line.map((c) => [c[1], c[0]]), distance: sum && sum.distance, duration: sum && sum.duration };
  } catch (e) { return null; }
}

function Spinner({ label }) {

function Empty({ icon, title, sub, action }) {

function ToastHost() {
  const [t, setT] = useState(null);
  useEffect(() => { toastFn = (msg, type) => { setT({ msg, type, k: Date.now() }); setTimeout(() => setT(null), 3200); }; }, []);
  if (!t) return null;
  const c = { info: 'border-brand', success: 'border-ok', error: 'border-bad' }[t.type] || 'border-brand';
  return <div key={t.k} className={cx('fixed bottom-4 left-1/2 -translate-x-1/2 z-[2000] bg-ink3 border-l-4 px-4 py-3 rounded-xl shadow-2xl text-sm fadein max-w-[90vw]', c)}>{t.msg}</div>;
}

/* ═══════════════════════════════════════════════════════════════════
   LEAFLET MAP
   ═══════════════════════════════════════════════════════════════════ */
function MapView({ stops = [], polyline, drivers = [], center, height = 360, onStopClick, fit = true }) {
  const ref = useRef(null), map = useRef(null), layers = useRef([]);
  useEffect(() => {
    if (map.current) return;
    map.current = L.map(ref.current, { zoomControl: true, attributionControl: false }).setView(center || [50.85, 4.35], 11);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd' }).addTo(map.current);
    setTimeout(() => map.current && map.current.invalidateSize(), 200);
  }, []);
  useEffect(() => {
    if (!map.current) return;
    layers.current.forEach((l) => map.current.removeLayer(l)); layers.current = [];
    const pts = [];
    stops.forEach((s, i) => {
      if (s.lat == null || s.lng == null) return;
      const color = s.color || '#3b82f6';
      const done = s._status === 'completed', prob = s._status === 'problem';
      const bg = done ? '#10b981' : prob ? '#ef4444' : color;
      const m = L.marker([s.lat, s.lng], {
        icon: L.divIcon({ className: '', html: `<div class="num-pin" style="width:28px;height:28px;background:${bg}">${i + 1}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] })
      }).addTo(map.current);
      m.on('click', () => onStopClick && onStopClick(s, i));
      m.bindPopup(`<b>${i + 1}. ${s.client_name || 'Stop'}</b><br>${s.address || ''}`);
      layers.current.push(m); pts.push([s.lat, s.lng]);
    });
    drivers.forEach((d) => {
      if (d.lat == null) return;
      const m = L.marker([d.lat, d.lng], {
        icon: L.divIcon({ className: '', html: `<div style="width:34px;height:34px;border-radius:50%;background:#f59e0b;border:3px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.6)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0b1120" stroke-width="2.5"><path d="M10 17h4V5H2v12h3"/><path d="M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5v8h1"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg></div>`, iconSize: [34, 34], iconAnchor: [17, 17] })
      }).addTo(map.current);
      m.bindPopup(`<b>${d.name || 'Chauffeur'}</b><br>${fmtTime(d.updated_at)}`);
      layers.current.push(m); pts.push([d.lat, d.lng]);
    });
    if (polyline && polyline.length) { const pl = L.polyline(polyline, { color: '#60a5fa', weight: 4, opacity: .8 }).addTo(map.current); layers.current.push(pl); }
    if (fit && pts.length) { try { map.current.fitBounds(pts, { padding: [40, 40], maxZoom: 15 }); } catch (e) {} }
    setTimeout(() => map.current && map.current.invalidateSize(), 100);
  }, [JSON.stringify(stops.map((s) => [s.id, s.lat, s.lng, s._status])), JSON.stringify(polyline), JSON.stringify(drivers)]);
  return <div ref={ref} style={{ height }} className="w-full rounded-2xl overflow-hidden border border-line" />;
}

/* ═══════════════════════════════════════════════════════════════════
   AUTH
   ═══════════════════════════════════════════════════════════════════ */
const AuthCtx = createContext(null);
const useAuth = () => useContext(AuthCtx);

function AuthProvider({ children }) {
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [loading, setLoading] = useState(true);

  const loadProfile = useCallback(async (userId) => {
    const { data } = await sb.from('users_profiles').select('*').eq('user_id', userId).maybeSingle();
    setProfile(data || null);
  }, []);

  useEffect(() => {
    sb.auth.getSession().then(async ({ data }) => {
      setSession(data.session);
      if (data.session) await loadProfile(data.session.user.id);
      setLoading(false);
    });
    const { data: sub } = sb.auth.onAuthStateChange(async (_e, s) => {
      setSession(s);
      if (s) await loadProfile(s.user.id); else setProfile(null);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  const signIn = async (identifier, password) => {
    // Convertit l'identifiant court (ex: "YG-T") en email Supabase (@aboupro.app)
    const email = identifier.trim().includes('@')
      ? identifier.trim()
      : identifier.trim().toLowerCase().replace(/\s+/g, '-') + '@aboupro.app';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
  };
  const signOut = async () => { await sb.auth.signOut(); setProfile(null); };

  return <AuthCtx.Provider value={{ session, profile, loading, signIn, signOut, reload: () => session && loadProfile(session.user.id) }}>{children}</AuthCtx.Provider>;
}

function LoginScreen() {
  const { signIn } = useAuth();
  const [id, setId] = useState(''); const [pw, setPw] = useState('');

  const submit = async (e) => {

    catch (e) { setErr(e.message === 'Invalid login credentials' ? 'Identifiant ou mot de passe incorrect.' : e.message); }

  return (
    <div className="min-h-full flex items-center justify-center p-5">
      <div className="w-full max-w-sm fadein">

          </div>
          <h1 className="text-3xl font-extrabold tracking-tight">ABOU PRO</h1>
          <p className="text-sm text-slate-500 mt-1">Gestion de tournées logistiques</p>
        </div>
        <Card className="p-6 shadow-2xl">
          <form onSubmit={submit} className="space-y-4">
            <Field label="Identifiant">
              <Input
                type="text"
                value={id}
                onChange={(e) => setId(e.target.value)}

              />

                placeholder="••••••••"

              />
            </Field>
            {err && (
              <div className="text-sm text-red-400 bg-red-500/10 border border-red-500/20 rounded-xl px-3 py-2 flex items-center gap-2">
                <Ico.alert size={16} className="flex-shrink-0" />{err}

                : <><Ico.right size={18} /> Se connecter</>}
            </Btn>
          </form>
        </Card>
        <p className="text-center text-xs text-slate-600 mt-5">Accès réservé — comptes créés par l'administrateur.</p>
      </div>
    </div>
  );
}

function DashboardView({ go }) {
  const [stats, setStats] = useState(null);
  const [today, setToday] = useState([]);
  const [drivers, setDrivers] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    const [r1, r2, r3, r4] = await Promise.all([
      sb.from('routes').select('id', { count: 'exact', head: true }).eq('active', true),
      sb.from('users_profiles').select('id', { count: 'exact', head: true }).eq('role', 'chauffeur').eq('active', true),
      sb.from('aboupro_assignments_view').select('*').eq('date', todayISO()).order('start_time'),
      sb.from('driver_positions').select('*')
    ]);
    const ta = r3.data || [];
    const done = ta.filter((a) => a.status === 'termine').length;
    const totalStops = ta.reduce((s, a) => s + (a.total_stops || 0), 0);
    const compStops = ta.reduce((s, a) => s + (a.completed_stops || 0), 0);
    setStats({ routes: r1.count || 0, drivers: r2.count || 0, todayCount: ta.length, done, rate: totalStops ? Math.round(100 * compStops / totalStops) : 0 });
    setToday(ta);
    // joindre noms chauffeurs aux positions
    const pos = r4.data || [];
    if (pos.length) {
      const ids = pos.map((p) => p.driver_id);
      const { data: profs } = await sb.from('users_profiles').select('user_id,name').in('user_id', ids);
      const map = Object.fromEntries((profs || []).map((p) => [p.user_id, p.name]));
      setDrivers(pos.map((p) => ({ ...p, name: map[p.driver_id] })));
    } else setDrivers([]);
    setLoading(false);
  }, []);

  useEffect(() => {
    load();
    const ch = sb.channel('dash-pos').on('postgres_changes', { event: '*', schema: 'public', table: 'driver_positions' }, load)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tour_logs' }, load).subscribe();
    const iv = setInterval(load, 30000);
    return () => { sb.removeChannel(ch); clearInterval(iv); };
  }, [load]);

  if (loading) return <Spinner label="Chargement du tableau de bord…" />;
  const kpis = [
    { label: 'Tournées actives', value: stats.routes, icon: <Ico.route />, c: 'text-brand2' },
    { label: 'Chauffeurs', value: stats.drivers, icon: <Ico.users />, c: 'text-amber' },
    { label: "Tournées aujourd'hui", value: stats.todayCount, icon: <Ico.cal />, c: 'text-emerald-400' },
    { label: 'Avancement du jour', value: stats.rate + '%', icon: <Ico.zap />, c: 'text-brand2' }
  ];
  return (
    <div className="space-y-5 fadein">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        {kpis.map((k, i) => (
          <Card key={i} className="p-4">
            <div className={cx('flex items-center gap-2 mb-2', k.c)}>{k.icon}<span className="text-xs text-slate-400 font-medium">{k.label}</span></div>
            <div className="text-3xl font-extrabold">{k.value}</div>
          </Card>
        ))}
      </div>

      <Card className="p-4">
        <div className="flex items-center justify-between mb-3">
          <h2 className="font-bold flex items-center gap-2"><Ico.pin size={18} /> Position des chauffeurs (live)</h2>
          <Btn variant="ghost" size="sm" onClick={load}><Ico.refresh size={16} /> Actualiser</Btn>
        </div>
        <MapView drivers={drivers} stops={[]} height={300} />
        {drivers.length === 0 && <p className="text-sm text-slate-500 mt-3">Aucun chauffeur ne partage sa position pour le moment.</p>}
      </Card>

      <Card className="p-4">
        <h2 className="font-bold mb-3 flex items-center gap-2"><Ico.cal size={18} /> Tournées du jour</h2>
        {today.length === 0 ? <Empty icon={<Ico.cal size={40} />} title="Aucune tournée planifiée aujourd'hui" action={<Btn size="sm" onClick={() => go('assign')}><Ico.plus size={16} /> Assigner une tournée</Btn>} />
          : <div className="space-y-2">{today.map((a) => <AssignmentRow key={a.id} a={a} />)}</div>}
      </Card>
    </div>
  );
}

function NewDriverModal({ open, onClose, onCreated }) {
  const [f, setF] = useState({ name: '', email: '', phone: '', password: '' });
  const [busy, setBusy] = useState(false); const [done, setDone] = useState(null); const [err, setErr] = useState('');
  const set = (k) => (e) => setF((p) => ({ ...p, [k]: e.target.value }));
  const genPw = () => setF((p) => ({ ...p, password: 'AP' + Math.random().toString(36).slice(2, 8) + '!' }));
  useEffect(() => { if (open) { setF({ name: '', email: '', phone: '', password: '' }); setDone(null); setErr(''); genPw(); } }, [open]);

  const create = async () => {
    setErr('');
    if (!f.email || !f.password || f.password.length < 6) { setErr('Identifiant et mot de passe (min. 6 caractères) requis.'); return; }
    setBusy(true);
    // Convertit l'identifiant court en email (@aboupro.app) comme pour la connexion
    const emailAddr = f.email.trim().includes('@')
      ? f.email.trim()
      : f.email.trim().toLowerCase().replace(/\s+/g, '-') + '@aboupro.app';
    try {
      const tmp = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, storageKey: 'aboupro_tmp_' + Date.now() } });
      const { data, error } = await tmp.auth.signUp({ email: emailAddr, password: f.password });
      if (error) throw error;
      const userId = data.user && data.user.id;
      if (!userId) throw new Error("Inscription impossible (l'email existe peut-être déjà).");
      // Le profil est inséré via le client admin (passe la RLS)
      const { error: e2 } = await sb.from('users_profiles').insert({ user_id: userId, name: f.name, phone: f.phone, role: 'chauffeur', active: true });
      try { await tmp.auth.signOut(); } catch (e) {}
      if (e2) throw e2;
      setDone({ email: f.email.trim(), password: f.password });
      toast('Chauffeur créé ✓', 'success'); onCreated && onCreated();
    } catch (e) { setErr(e.message || String(e)); }
    setBusy(false);
  };

  return (
    <Modal open={open} onClose={onClose} title="Nouveau chauffeur">
      {done ? (
        <div className="space-y-4">
          <div className="bg-emerald-500/10 border border-emerald-500/20 rounded-xl p-4">
            <div className="flex items-center gap-2 text-emerald-300 font-semibold mb-3"><Ico.check /> Compte créé</div>
            <p className="text-sm text-slate-400 mb-3">Transmets ces accès au chauffeur :</p>
            <div className="space-y-2 text-sm">
              <div className="flex items-center justify-between bg-ink3 rounded-lg px-3 py-2"><span className="text-slate-400">Identifiant</span><span className="font-mono font-bold">{done.email}</span></div>
              <div className="flex items-center justify-between bg-ink3 rounded-lg px-3 py-2"><span className="text-slate-400">Mot de passe</span><span className="font-mono">{done.password}</span></div>
            </div>
            <Btn variant="ghost" size="sm" className="w-full mt-3" onClick={() => { navigator.clipboard.writeText(`ABOU PRO\nIdentifiant: ${done.email}\nMot de passe: ${done.password}`); toast('Copié ✓', 'success'); }}><Ico.copy size={16} /> Copier les accès</Btn>
          </div>
          <Btn className="w-full" onClick={onClose}>Terminé</Btn>
        </div>
      ) : (
        <div className="space-y-4">
          <Field label="Nom complet"><Input value={f.name} onChange={set('name')} placeholder="Jean Dupont" /></Field>
          <Field label="Identifiant" hint="Court et sans espaces — ex: JEAN-D, CHAUFFEUR1">
            <Input type="text" value={f.email} onChange={set('email')} placeholder="Ex : JEAN-D" autoCapitalize="off" autoCorrect="off" spellCheck={false} />
          </Field>
          <Field label="Téléphone"><Input value={f.phone} onChange={set('phone')} placeholder="+32 …" /></Field>
          <Field label="Mot de passe temporaire">
            <div className="flex gap-2"><Input value={f.password} onChange={set('password')} /><Btn variant="ghost" size="sm" onClick={genPw}><Ico.refresh size={16} /></Btn></div>
          </Field>
          {err && <div className="text-sm text-red-400 bg-red-500/10 border border-red-500/20 rounded-xl px-3 py-2">{err}</div>}
          <p className="text-[11px] text-slate-500">Astuce : dans Supabase → Authentication → Providers → Email, désactive « Confirm email » pour que le chauffeur puisse se connecter immédiatement.</p>
          <Btn className="w-full" size="lg" onClick={create} disabled={busy}>{busy ? <span className="w-5 h-5 border-2 border-white/40 border-t-white rounded-full spin" /> : 'Créer le compte'}</Btn>
        </div>
      )}
    </Modal>
  );
}

/* ── Tournées (routes + stops) ───────────────────────────────────── */
const COLORS = ['#3b82f6', '#f59e0b', '#10b981', '#ef4444', '#a855f7', '#ec4899', '#06b6d4', '#84cc16'];

function RoutesView() {
  const [routes, setRoutes] = useState(null);
  const [sel, setSel] = useState(null);
  const [modal, setModal] = useState(false);

  const load = useCallback(async () => {
    const { data } = await sb.from('routes').select('*').order('created_at', { ascending: false });
    // compter les stops
    const withCounts = await Promise.all((data || []).map(async (r) => {
      const { count } = await sb.from('stops').select('id', { count: 'exact', head: true }).eq('route_id', r.id);
      return { ...r, stopCount: count || 0 };
    }));
    setRoutes(withCounts);
  }, []);
  useEffect(() => { load(); }, [load]);

  if (sel) return <RouteEditor routeId={sel} onBack={() => { setSel(null); load(); }} />;

  return (
    <div className="space-y-4 fadein">
      <div className="flex items-center justify-between">
        <h2 className="text-xl font-bold">Tournées <span className="text-slate-500 text-base">({routes.length})</span></h2>
        <Btn onClick={() => setModal(true)}><Ico.plus size={18} /> Nouvelle tournée</Btn>
      </div>
      {routes.length === 0 ? <Empty icon={<Ico.route size={44} />} title="Aucune tournée" sub="Crée ta première tournée, puis ajoute ou importe des stops." />
        : <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">{routes.map((r) => (
          <Card key={r.id} className="p-4 cursor-pointer hover:border-brand/50 transition" onClick={() => setSel(r.id)}>
            <div className="flex items-start gap-3">
              <span className="w-3 h-3 rounded-full mt-1.5 flex-shrink-0" style={{ background: r.color }} />
              <div className="flex-1 min-w-0">
                <div className="font-bold truncate">{r.name}</div>
                <div className="text-xs text-slate-400 mt-0.5">{r.stopCount} stop{r.stopCount > 1 ? 's' : ''}{!r.active && ' · archivée'}</div>
                {r.description && <div className="text-xs text-slate-500 mt-1 line-clamp-2">{r.description}</div>}

function RouteModal({ open, onClose, onSaved, route }) {
  const [f, setF] = useState({ name: '', color: COLORS[0], description: '' });
  const [busy, setBusy] = useState(false);
  useEffect(() => { if (open) setF(route ? { name: route.name, color: route.color, description: route.description || '' } : { name: '', color: COLORS[0], description: '' }); }, [open, route]);
  const save = async () => {
    if (!f.name.trim()) { toast('Nom requis', 'error'); return; }
    setBusy(true);
    const { data: u } = await sb.auth.getUser();
    if (route) await sb.from('routes').update(f).eq('id', route.id);
    else await sb.from('routes').insert({ ...f, created_by: u.user.id });
    setBusy(false); onSaved && onSaved(); onClose();
    toast(route ? 'Tournée mise à jour ✓' : 'Tournée créée ✓', 'success');
  };
  return (
    <Modal open={open} onClose={onClose} title={route ? 'Modifier la tournée' : 'Nouvelle tournée'}>
      <div className="space-y-4">
        <Field label="Nom de la tournée"><Input value={f.name} onChange={(e) => setF((p) => ({ ...p, name: e.target.value }))} placeholder="Ex. Centre-ville matin" /></Field>
        <Field label="Couleur">
          <div className="flex gap-2 flex-wrap">{COLORS.map((c) => <button key={c} onClick={() => setF((p) => ({ ...p, color: c }))} className={cx('w-9 h-9 rounded-xl border-2 transition', f.color === c ? 'border-white scale-110' : 'border-transparent')} style={{ background: c }} />)}</div>
        </Field>
        <Field label="Description (optionnel)"><Textarea value={f.description} onChange={(e) => setF((p) => ({ ...p, description: e.target.value }))} placeholder="Notes internes…" /></Field>
        <Btn className="w-full" size="lg" onClick={save} disabled={busy}>{busy ? '…' : (route ? 'Enregistrer' : 'Créer')}</Btn>

function RouteEditor({ routeId, onBack }) {
  const [route, setRoute] = useState(null);
  const [stops, setStops] = useState([]);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState('list');
  const [stopModal, setStopModal] = useState(false);
  const [editStop, setEditStop] = useState(null);
  const [importModal, setImportModal] = useState(false);
  const [editRoute, setEditRoute] = useState(false);
  const [polyline, setPolyline] = useState(null);
  const [optInfo, setOptInfo] = useState(null);
  const [optBusy, setOptBusy] = useState(false);
  const [geoBusy, setGeoBusy] = useState(false);
  const dragIdx = useRef(null);

  const load = useCallback(async () => {
    const [r, s] = await Promise.all([
      sb.from('routes').select('*').eq('id', routeId).single(),
      sb.from('stops').select('*').eq('route_id', routeId).order('order_index')
    ]);
    setRoute(r.data); setStops(s.data || []); setLoading(false);
  }, [routeId]);
  useEffect(() => { load(); }, [load]);

  const persistOrder = async (arr) => {
    setStops(arr);
    await Promise.all(arr.map((s, i) => sb.from('stops').update({ order_index: i }).eq('id', s.id)));
  };
  const onDrop = (i) => { const from = dragIdx.current; if (from == null || from === i) return; const a = [...stops]; const [m] = a.splice(from, 1); a.splice(i, 0, m); dragIdx.current = null; persistOrder(a); };
  const move = (i, dir) => { const j = i + dir; if (j < 0 || j >= stops.length) return; const a = [...stops]; [a[i], a[j]] = [a[j], a[i]]; persistOrder(a); };

  const delStop = async (s) => { if (!confirm('Supprimer ce stop ?')) return; await sb.from('stops').delete().eq('id', s.id); load(); };

  const geocodeMissing = async () => {
    const todo = stops.filter((s) => (s.lat == null || s.lng == null) && s.address);
    if (!todo.length) { toast('Tous les stops sont déjà géocodés', 'info'); return; }
    setGeoBusy(true); let ok = 0;
    for (const s of todo) {
      const g = await orsGeocode(s.address + (s.client_name ? '' : ''));
      if (g) { await sb.from('stops').update({ lat: g.lat, lng: g.lng, geocoded: true }).eq('id', s.id); ok++; }
      await new Promise((r) => setTimeout(r, 350)); // rythme l'API
    }
    setGeoBusy(false); toast(`${ok}/${todo.length} adresses géocodées`, ok ? 'success' : 'error'); load();
  };

  const optimize = async () => {
    const geo = stops.filter((s) => s.lat != null && s.lng != null);
    if (geo.length < 2) { toast('Géocode au moins 2 stops d\'abord', 'error'); return; }
    setOptBusy(true);
    const profile = 'driving-car';
    const before = geo.length;
    const res = await orsOptimize(geo, profile);
    const reordered = res.order.map((i) => geo[i]);
    const ungeo = stops.filter((s) => s.lat == null || s.lng == null);
    const final = [...reordered, ...ungeo];
    await persistOrder(final);
    // tracé
    const rt = await orsRoute(reordered.map((s) => [s.lng, s.lat]), profile);
    if (rt) { setPolyline(rt.line); setOptInfo({ distance: rt.distance, duration: rt.duration, fallback: res.fallback }); }
    setView('map'); setOptBusy(false);
    toast(res.fallback ? 'Optimisé (mode hors-ligne)' : `Optimisé : ${before} stops`, 'success');
  };

  const gmapsUrl = useMemo(() => {
    const g = stops.filter((s) => s.lat != null);
    if (!g.length) return null;
    const pts = g.map((s) => `${s.lat},${s.lng}`);
    return 'https://www.google.com/maps/dir/' + pts.join('/');
  }, [stops]);

  if (loading) return <Spinner />;
  const geoCount = stops.filter((s) => s.lat != null).length;

  return (
    <div className="space-y-4 fadein">
      <button onClick={onBack} className="text-slate-400 hover:text-white flex items-center gap-2 text-sm font-medium"><Ico.back size={18} /> Toutes les tournées</button>
      <div className="flex items-start justify-between gap-3 flex-wrap">
        <div className="flex items-center gap-3">
          <span className="w-4 h-4 rounded-full" style={{ background: route.color }} />
          <div>
            <h2 className="text-xl font-bold">{route.name}</h2>
            <div className="text-xs text-slate-400">{stops.length} stops · {geoCount} géocodés</div>
          </div>
          <button onClick={() => setEditRoute(true)} className="text-slate-500 hover:text-white p-1"><Ico.edit size={16} /></button>
        </div>
        <div className="flex gap-2 flex-wrap">
          <Btn variant="ghost" size="sm" onClick={() => setImportModal(true)}><Ico.upload size={16} /> Importer</Btn>
          <Btn variant="ghost" size="sm" onClick={geocodeMissing} disabled={geoBusy}>{geoBusy ? <span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full spin" /> : <Ico.pin size={16} />} Géocoder</Btn>
          <Btn size="sm" onClick={optimize} disabled={optBusy}>{optBusy ? <span className="w-4 h-4 border-2 border-white/40 border-t-white rounded-full spin" /> : <Ico.zap size={16} />} Optimiser</Btn>
        </div>
      </div>

      <div className="flex gap-1 bg-ink2 border border-line rounded-xl p-1 w-fit">
        {[['list', 'Liste', <Ico.list size={16} />], ['map', 'Carte', <Ico.map size={16} />]].map(([id, lbl, ic]) => (
          <button key={id} onClick={() => setView(id)} className={cx('px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-1.5', view === id ? 'bg-brand text-white' : 'text-slate-400')}>{ic}{lbl}</button>
        ))}
      </div>

      {optInfo && view === 'map' && (
        <Card className="p-3 flex items-center gap-4 text-sm">
          <span className="flex items-center gap-1.5 text-brand2"><Ico.route size={16} /> {fmtKm(optInfo.distance)}</span>
          <span className="flex items-center gap-1.5 text-amber"><Ico.clock size={16} /> {fmtDur(optInfo.duration)}</span>
          {optInfo.fallback && <span className="text-slate-500 text-xs">estimation hors-ligne</span>}
        </Card>
      )}

      {view === 'map' ? (
        <div className="space-y-3">
          <MapView stops={stops.map((s) => ({ ...s, color: route.color }))} polyline={polyline} height={420} onStopClick={(s) => { setEditStop(s); setStopModal(true); }} />
          {gmapsUrl && <div className="flex gap-2"><a href={gmapsUrl} target="_blank" rel="noreferrer" className="flex-1"><Btn variant="ghost" className="w-full"><Ico.nav size={16} /> Google Maps</Btn></a></div>}
        </div>
      ) : (
        <div className="space-y-2">
          <Btn variant="outline" className="w-full" onClick={() => { setEditStop(null); setStopModal(true); }}><Ico.plus size={16} /> Ajouter un stop</Btn>
          {stops.length === 0 ? <Empty icon={<Ico.pin size={40} />} title="Aucun stop" sub="Ajoute des stops manuellement ou importe une liste collée." />
            : stops.map((s, i) => (
              <div key={s.id} draggable onDragStart={() => (dragIdx.current = i)} onDragOver={(e) => e.preventDefault()} onDrop={() => onDrop(i)}
                className="flex items-center gap-3 bg-ink2 border border-line rounded-xl p-3 group">
                <div className="flex flex-col gap-0.5">
                  <button onClick={() => move(i, -1)} className="text-slate-600 hover:text-white"><Ico.left className="rotate-90" size={14} /></button>
                  <span className="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold text-white" style={{ background: route.color }}>{i + 1}</span>
                  <button onClick={() => move(i, 1)} className="text-slate-600 hover:text-white"><Ico.right className="rotate-90" size={14} /></button>
                </div>
                <div className="flex-1 min-w-0" onClick={() => { setEditStop(s); setStopModal(true); }}>
                  <div className="font-semibold truncate flex items-center gap-2">{s.client_name || 'Sans nom'}
                    {s.lat == null && <span className="text-[10px] text-amber bg-amber/10 px-1.5 rounded">non géocodé</span>}
                  </div>
                  <div className="text-xs text-slate-400 truncate">{s.address || '—'}</div>
                  <div className="flex items-center gap-2 mt-1 text-[11px] text-slate-500">
                    {s.scheduled_time && <span className="flex items-center gap-0.5"><Ico.clock size={11} />{fmtTime(s.scheduled_time)}</span>}
                    {s.requires_photo && <span className="flex items-center gap-0.5 text-brand2"><Ico.cam size={11} />photo</span>}
                    {s.requires_scan && <span className="flex items-center gap-0.5 text-amber"><Ico.qr size={11} />scan</span>}
                    {(s.days_active || []).length > 0 && <span>{(s.days_active || []).join(' ')}</span>}
                  </div>
                </div>
                <button onClick={() => delStop(s)} className="text-slate-600 hover:text-red-400 p-1 opacity-0 group-hover:opacity-100 transition"><Ico.trash size={16} /></button>
              </div>
            ))}
        </div>
      )}

      <StopModal open={stopModal} onClose={() => setStopModal(false)} routeId={routeId} stop={editStop} nextOrder={stops.length} onSaved={load} />
      <ImportModal open={importModal} onClose={() => setImportModal(false)} routeId={routeId} startOrder={stops.length} onDone={load} />
      <RouteModal open={editRoute} onClose={() => setEditRoute(false)} route={route} onSaved={load} />
    </div>
  );
}

function StopModal({ open, onClose, routeId, stop, nextOrder, onSaved }) {
  const blank = { client_name: '', address: '', scheduled_time: '', operation_type: '', notes: '', access_code: '', parking_info: '', days_active: [], requires_photo: false, requires_scan: false };
  const [f, setF] = useState(blank);
  const [busy, setBusy] = useState(false);
  useEffect(() => {
    if (open) setF(stop ? { ...blank, ...stop, scheduled_time: stop.scheduled_time ? stop.scheduled_time.slice(0, 5) : '', days_active: stop.days_active || [] } : blank);
  }, [open, stop]);
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  const toggleDay = (d) => setF((p) => ({ ...p, days_active: p.days_active.includes(d) ? p.days_active.filter((x) => x !== d) : [...p.days_active, d] }));
  const save = async () => {
    if (!f.client_name && !f.address) { toast('Nom ou adresse requis', 'error'); return; }
    setBusy(true);
    const payload = {
      route_id: routeId, client_name: f.client_name, address: f.address,
      scheduled_time: f.scheduled_time || null, operation_type: f.operation_type, notes: f.notes,
      access_code: f.access_code, parking_info: f.parking_info, days_active: f.days_active,
      requires_photo: f.requires_photo, requires_scan: f.requires_scan
    };
    let stopId = stop && stop.id;
    if (stop) await sb.from('stops').update(payload).eq('id', stop.id);
    else { const { data } = await sb.from('stops').insert({ ...payload, order_index: nextOrder }).select().single(); stopId = data && data.id; }
    // géocode si adresse changée / nouvelle
    if (f.address && (!stop || stop.address !== f.address)) {
      const g = await orsGeocode(f.address);
      if (g && stopId) await sb.from('stops').update({ lat: g.lat, lng: g.lng, geocoded: true }).eq('id', stopId);
    }
    setBusy(false); onSaved && onSaved(); onClose();
    toast(stop ? 'Stop mis à jour ✓' : 'Stop ajouté ✓', 'success');
  };
  return (
    <Modal open={open} onClose={onClose} title={stop ? 'Modifier le stop' : 'Nouveau stop'} wide>
      <div className="grid sm:grid-cols-2 gap-4">
        <Field label="Nom du client"><Input value={f.client_name} onChange={(e) => set('client_name', e.target.value)} placeholder="Boulangerie Martin" /></Field>
        <Field label="Heure souhaitée"><Input type="time" value={f.scheduled_time} onChange={(e) => set('scheduled_time', e.target.value)} /></Field>
        <div className="sm:col-span-2"><Field label="Adresse complète" hint="Géocodée automatiquement à l'enregistrement"><Input value={f.address} onChange={(e) => set('address', e.target.value)} placeholder="Rue de la Loi 16, 1000 Bruxelles" /></Field></div>
        <Field label="Type d'opération"><Input value={f.operation_type} onChange={(e) => set('operation_type', e.target.value)} placeholder="Livraison / Collecte…" /></Field>
        <Field label="Code d'accès"><Input value={f.access_code} onChange={(e) => set('access_code', e.target.value)} placeholder="Digicode B1234" /></Field>
        <div className="sm:col-span-2"><Field label="Info parking"><Input value={f.parking_info} onChange={(e) => set('parking_info', e.target.value)} placeholder="Stationnement livraison devant" /></Field></div>
        <div className="sm:col-span-2"><Field label="Notes / instructions"><Textarea value={f.notes} onChange={(e) => set('notes', e.target.value)} /></Field></div>
        <div className="sm:col-span-2">
          <span className="text-xs font-medium text-slate-400 mb-1.5 block">Jours actifs</span>
          <div className="flex gap-1.5 flex-wrap">{DAYS.map((d) => <button key={d} onClick={() => toggleDay(d)} className={cx('px-3 py-1.5 rounded-lg text-sm font-semibold border transition', f.days_active.includes(d) ? 'bg-brand border-brand text-white' : 'border-line text-slate-400')}>{d}</button>)}</div>

        <label className="flex items-center gap-3 bg-ink3/50 rounded-xl px-3 py-2.5 cursor-pointer"><input type="checkbox" checked={f.requires_scan} onChange={(e) => set('requires_scan', e.target.checked)} className="w-5 h-5 accent-brand" /><span className="text-sm flex items-center gap-1.5"><Ico.qr size={16} /> Scan obligatoire</span></label>
      </div>
      <Btn className="w-full mt-5" size="lg" onClick={save} disabled={busy}>{busy ? 'Enregistrement…' : (stop ? 'Enregistrer' : 'Ajouter le stop')}</Btn>
    </Modal>
  );
}

function ImportModal({ open, onClose, routeId, startOrder, onDone }) {
  const [text, setText] = useState('');
  const [busy, setBusy] = useState(false);
  const [preview, setPreview] = useState([]);

  // Parse intelligent : 1 ligne = 1 stop. Sépare par tab / ; / ,
  const parse = (raw) => {
    const lines = raw.split('\n').map((l) => l.trim()).filter(Boolean);
    return lines.map((line) => {
      const parts = line.split(/\t|;|,(?=\s*\d{4})|,/).map((p) => p.trim()).filter(Boolean);
      // heuristiques : 1er = nom, suivant contenant des chiffres = adresse, heure type HH:MM
      let name = '', addr = '', time = '', notes = '';
      const timeMatch = line.match(/\b([01]?\d|2[0-3])[:hH]([0-5]\d)\b/);
      if (timeMatch) time = timeMatch[1].padStart(2, '0') + ':' + timeMatch[2];
      if (parts.length === 1) { addr = parts[0]; }
      else {
        name = parts[0];
        const addrPart = parts.slice(1).find((p) => /\d/.test(p));
        addr = addrPart || parts[1] || '';
        notes = parts.slice(1).filter((p) => p !== addr && !/^[\d:hH]+$/.test(p)).join(' · ');
      }
      return { client_name: name, address: addr, scheduled_time: time, notes };
    });
  };
  useEffect(() => { setPreview(text.trim() ? parse(text) : []); }, [text]);

  const run = async () => {
    if (!preview.length) return;
    setBusy(true);
    // dédup par adresse normalisée
    const seen = new Set(); const rows = [];
    preview.forEach((p, i) => {
      const key = (p.address || p.client_name).toLowerCase().replace(/\s+/g, ' ').trim();
      if (key && seen.has(key)) return; seen.add(key);
      rows.push({ route_id: routeId, client_name: p.client_name, address: p.address, scheduled_time: p.scheduled_time || null, notes: p.notes || '', order_index: startOrder + rows.length });
    });
    const { data, error } = await sb.from('stops').insert(rows).select();
    if (error) { toast(error.message, 'error'); setBusy(false); return; }
    toast(`${rows.length} stops importés · géocodage…`, 'success');
    onDone && onDone(); onClose(); setText('');
    // géocode en arrière-plan
    for (const s of (data || [])) {
      if (!s.address) continue;
      const g = await orsGeocode(s.address);
      if (g) await sb.from('stops').update({ lat: g.lat, lng: g.lng, geocoded: true }).eq('id', s.id);
      await new Promise((r) => setTimeout(r, 350));
    }
    onDone && onDone();
    setBusy(false);
  };
  return (
    <Modal open={open} onClose={onClose} title="Importer des stops" wide>
      <div className="space-y-4">
        <p className="text-sm text-slate-400">Colle ta liste (Excel, CSV ou texte). Une ligne = un stop. Format conseillé : <span className="text-slate-300">Nom ; Adresse ; Heure ; Notes</span></p>
        <Textarea value={text} onChange={(e) => setText(e.target.value)} className="min-h-[160px] font-mono text-sm" placeholder={"Boulangerie Martin; Rue de la Loi 16, 1000 Bruxelles; 08:30; sonner 2x\nPharmacie Centrale; Av. Louise 200, 1050; 09:15"} />
        {preview.length > 0 && (
          <div className="bg-ink3/40 rounded-xl p-3 max-h-52 overflow-y-auto">
            <div className="text-xs text-slate-400 mb-2">{preview.length} stop(s) détecté(s) :</div>
            {preview.slice(0, 50).map((p, i) => (
              <div key={i} className="text-sm py-1.5 border-b border-line/50 last:border-0">
                <span className="font-semibold">{p.client_name || '(sans nom)'}</span>
                <span className="text-slate-400"> — {p.address || '?'}</span>
                {p.scheduled_time && <span className="text-amber text-xs ml-2">{p.scheduled_time}</span>}
              </div>
            ))}
          </div>
        )}
        <Btn className="w-full" size="lg" onClick={run} disabled={busy || !preview.length}>{busy ? <span className="flex items-center gap-2"><span className="w-5 h-5 border-2 border-white/40 border-t-white rounded-full spin" /> Import & géocodage…</span> : `Importer ${preview.length} stop(s)`}</Btn>
      </div>
    </Modal>
  );
}

/* ── Assignations ────────────────────────────────────────────────── */
function AssignmentsView() {
  const [date, setDate] = useState(todayISO());
  const [list, setList] = useState(null);

  }, [date]);

function AssignModal({ open, onClose, date, onSaved }) {
  const [routes, setRoutes] = useState([]); const [drivers, setDrivers] = useState([]); const [stops, setStops] = useState([]);
  const [f, setF] = useState({ route_id: '', driver_id: '', vehicle_type: 'voiture', start_time: '08:00', end_time_max: '', notes: '' });
  const [mode, setMode] = useState('all'); const [picked, setPicked] = useState({});
  const [busy, setBusy] = useState(false);
  useEffect(() => {
    if (!open) return;
    setF({ route_id: '', driver_id: '', vehicle_type: 'voiture', start_time: '08:00', end_time_max: '', notes: '' }); setMode('all'); setPicked({});
    Promise.all([
      sb.from('routes').select('id,name,color').eq('active', true).order('name'),
      sb.from('users_profiles').select('user_id,name').eq('role', 'chauffeur').eq('active', true).order('name')
    ]).then(([r, d]) => { setRoutes(r.data || []); setDrivers(d.data || []); });
  }, [open]);
  useEffect(() => {
    if (f.route_id) sb.from('stops').select('*').eq('route_id', f.route_id).order('order_index').then(({ data }) => { setStops(data || []); setPicked(Object.fromEntries((data || []).map((s) => [s.id, true]))); });
    else setStops([]);
  }, [f.route_id]);

  const save = async () => {
    if (!f.route_id || !f.driver_id) { toast('Tournée et chauffeur requis', 'error'); return; }
    setBusy(true);
    const { data: u } = await sb.auth.getUser();
    const { data: a, error } = await sb.from('assignments').insert({
      route_id: f.route_id, driver_id: f.driver_id, date, vehicle_type: f.vehicle_type,
      start_time: f.start_time || null, end_time_max: f.end_time_max || null, notes: f.notes, assigned_by: u.user.id, status: 'planifie'
    }).select().single();
    if (error) { toast(error.message, 'error'); setBusy(false); return; }
    const chosen = mode === 'all' ? stops : stops.filter((s) => picked[s.id]);
    if (chosen.length) {
      await sb.from('assignment_stops').insert(chosen.map((s, i) => ({ assignment_id: a.id, stop_id: s.id, order_index: i })));
    }
    setBusy(false); onSaved && onSaved(); onClose();
    toast('Tournée assignée ✓', 'success');
  };
  const pickedCount = Object.values(picked).filter(Boolean).length;
  return (
    <Modal open={open} onClose={onClose} title="Assigner une tournée" wide>
      <div className="space-y-4">
        <div className="grid sm:grid-cols-2 gap-4">
          <Field label="Tournée"><Select value={f.route_id} onChange={(e) => setF((p) => ({ ...p, route_id: e.target.value }))}><option value="">Choisir…</option>{routes.map((r) => <option key={r.id} value={r.id}>{r.name}</option>)}</Select></Field>
          <Field label="Chauffeur"><Select value={f.driver_id} onChange={(e) => setF((p) => ({ ...p, driver_id: e.target.value }))}><option value="">Choisir…</option>{drivers.map((d) => <option key={d.user_id} value={d.user_id}>{d.name}</option>)}</Select></Field>
          <Field label="Véhicule"><Select value={f.vehicle_type} onChange={(e) => setF((p) => ({ ...p, vehicle_type: e.target.value }))}>{VEHICLES.map((v) => <option key={v.id} value={v.id}>{v.label}</option>)}</Select></Field>
          <Field label="Date"><Input value={fmtDate(date)} disabled /></Field>
          <Field label="Heure de départ"><Input type="time" value={f.start_time} onChange={(e) => setF((p) => ({ ...p, start_time: e.target.value }))} /></Field>
          <Field label="Heure de fin max"><Input type="time" value={f.end_time_max} onChange={(e) => setF((p) => ({ ...p, end_time_max: e.target.value }))} /></Field>
        </div>
        {stops.length > 0 && (
          <div>
            <div className="flex items-center gap-2 mb-2">
              <button onClick={() => setMode('all')} className={cx('px-3 py-1.5 rounded-lg text-sm font-semibold', mode === 'all' ? 'bg-brand text-white' : 'bg-ink3 text-slate-400')}>Tous les stops ({stops.length})</button>
              <button onClick={() => setMode('some')} className={cx('px-3 py-1.5 rounded-lg text-sm font-semibold', mode === 'some' ? 'bg-brand text-white' : 'bg-ink3 text-slate-400')}>Sélection ({pickedCount})</button>
            </div>
            {mode === 'some' && <div className="bg-ink3/40 rounded-xl p-2 max-h-48 overflow-y-auto space-y-1">{stops.map((s, i) => (
              <label key={s.id} className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-ink3 cursor-pointer text-sm">
                <input type="checkbox" checked={!!picked[s.id]} onChange={(e) => setPicked((p) => ({ ...p, [s.id]: e.target.checked }))} className="w-4 h-4 accent-brand" />
                <span className="text-slate-500">{i + 1}.</span><span className="font-medium">{s.client_name || s.address}</span>
              </label>))}</div>}
          </div>
        )}
        <Field label="Note (optionnel)"><Input value={f.notes} onChange={(e) => setF((p) => ({ ...p, notes: e.target.value }))} /></Field>
        <Btn className="w-full" size="lg" onClick={save} disabled={busy}>{busy ? '…' : 'Assigner la tournée'}</Btn>
      </div>
    </Modal>
  );
}

function DriverRun({ assignment, onBack, profile }) {
  const [stops, setStops] = useState(null);
  const [logs, setLogs] = useState({});
  const [idx, setIdx] = useState(0);
  const [status, setStatus] = useState(assignment.status);
  const watchId = useRef(null);

  const load = useCallback(async () => {
    const { data: aps } = await sb.from('assignment_stops').select('stop_id,order_index,stops(*)').eq('assignment_id', assignment.id).order('order_index');
    let list = (aps || []).map((r) => r.stops).filter(Boolean);
    if (!list.length) { const { data } = await sb.from('stops').select('*').eq('route_id', assignment.route_id).order('order_index'); list = data || []; }
    const { data: tl } = await sb.from('tour_logs').select('*').eq('assignment_id', assignment.id);
    const lmap = Object.fromEntries((tl || []).map((l) => [l.stop_id, l]));
    setLogs(lmap); setStops(list);
    const firstPending = list.findIndex((s) => !lmap[s.id] || lmap[s.id].status === 'pending' || lmap[s.id].status === 'arrived');
    setIdx(firstPending >= 0 ? firstPending : 0);
  }, [assignment]);
  useEffect(() => { load(); }, [load]);

  // Tracking GPS pendant la tournée
  useEffect(() => {
    if (status !== 'en_cours' || !navigator.geolocation) return;
    watchId.current = navigator.geolocation.watchPosition(async (pos) => {
      const { latitude, longitude, accuracy, speed, heading } = pos.coords;
      await sb.from('driver_positions').upsert({
        driver_id: profile.user_id, lat: latitude, lng: longitude, accuracy,
        speed: speed != null ? speed * 3.6 : null, heading, assignment_id: assignment.id, updated_at: new Date().toISOString()
      }, { onConflict: 'driver_id' });
    }, () => {}, { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 });
    return () => { if (watchId.current != null) navigator.geolocation.clearWatch(watchId.current); };
  }, [status]);

  const start = async () => { await sb.from('assignments').update({ status: 'en_cours', started_at: new Date().toISOString() }).eq('id', assignment.id); setStatus('en_cours'); toast('Tournée démarrée 🚀', 'success'); };
  const finish = async () => {
    const problems = Object.values(logs).filter((l) => l.status === 'problem').length;
    await sb.from('assignments').update({ status: problems ? 'incident' : 'termine', finished_at: new Date().toISOString() }).eq('id', assignment.id);
    if (watchId.current != null) navigator.geolocation.clearWatch(watchId.current);
    toast('Tournée terminée ✓', 'success'); onBack();
  };

  if (!stops) return <Spinner label="Chargement de la tournée…" />;
  const done = stops.filter((s) => logs[s.id] && (logs[s.id].status === 'completed' || logs[s.id].status === 'problem')).length;
  const allDone = done === stops.length && stops.length > 0;
  const stop = stops[idx];

  return (
    <div className="min-h-full flex flex-col max-w-lg mx-auto w-full">
      <header className="sticky top-0 z-40 bg-ink/95 backdrop-blur border-b border-line px-3 h-14 flex items-center gap-2">
        <button onClick={onBack} className="text-slate-400 hover:text-white p-2"><Ico.back /></button>
        <div className="flex-1 min-w-0"><div className="font-bold truncate flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-full" style={{ background: assignment.route_color }} />{assignment.route_name}</div></div>
        <span className="text-sm font-semibold text-slate-300">{done}/{stops.length}</span>
      </header>
      <div className="h-1.5 bg-ink"><div className="h-full bg-brand transition-all" style={{ width: (stops.length ? 100 * done / stops.length : 0) + '%' }} /></div>

      {status === 'planifie' ? (
        <div className="flex-1 flex flex-col items-center justify-center p-8 gap-5 text-center">
          <div className="w-20 h-20 rounded-3xl bg-ink2 border border-line flex items-center justify-center text-brand"><Ico.play size={40} /></div>
          <div><div className="text-xl font-bold">Prêt à démarrer</div><div className="text-slate-400 text-sm mt-1">{stops.length} stops · {VEHICLES.find((v) => v.id === assignment.vehicle_type)?.label}</div></div>
          <Btn size="xl" className="w-full" onClick={start}><Ico.play size={22} /> Démarrer la tournée</Btn>
          <p className="text-xs text-slate-500">La position GPS sera partagée pendant la tournée.</p>
        </div>
      ) : allDone ? (
        <div className="flex-1 flex flex-col items-center justify-center p-8 gap-5 text-center">
          <div className="w-20 h-20 rounded-full bg-emerald-500/15 flex items-center justify-center text-emerald-400"><Ico.check size={44} /></div>
          <div><div className="text-xl font-bold">Tous les stops traités !</div><div className="text-slate-400 text-sm mt-1">{done} stops · {Object.values(logs).filter((l) => l.status === 'problem').length} problème(s)</div></div>
          <Btn size="xl" variant="ok" className="w-full" onClick={finish}><Ico.flag size={22} /> Clôturer la tournée</Btn>
        </div>
      ) : (
        <DriverStop key={stop.id} stop={stop} idx={idx} total={stops.length} log={logs[stop.id]} assignment={assignment} profile={profile}
          onPrev={() => setIdx((i) => Math.max(0, i - 1))} onNext={() => setIdx((i) => Math.min(stops.length - 1, i + 1))}
          onSaved={(l) => { setLogs((p) => ({ ...p, [stop.id]: l })); setTimeout(() => setIdx((i) => Math.min(stops.length - 1, i + (i < stops.length - 1 ? 1 : 0))), 600); }} />
      )}
    </div>
  );
}

function DriverStop({ stop, idx, total, log, assignment, profile, onPrev, onNext, onSaved }) {
  const [busy, setBusy] = useState(false);
  const [photoModal, setPhotoModal] = useState(false);
  const [problemModal, setProblemModal] = useState(false);
  const [scanModal, setScanModal] = useState(false);
  const [photoBlob, setPhotoBlob] = useState(null);
  const [scanCode, setScanCode] = useState(log?.scan_code || '');
  const completed = log && (log.status === 'completed' || log.status === 'problem');

  const navUrl = stop.lat != null ? `https://www.google.com/maps/dir/?api=1&destination=${stop.lat},${stop.lng}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(stop.address)}`;
  const wazeUrl = stop.lat != null ? `https://waze.com/ul?ll=${stop.lat},${stop.lng}&navigate=yes` : `https://waze.com/ul?q=${encodeURIComponent(stop.address)}`;

  const upsertLog = async (patch) => {
    const base = { assignment_id: assignment.id, stop_id: stop.id, driver_id: profile.user_id };
    const { data, error } = await sb.from('tour_logs').upsert({ ...base, ...patch }, { onConflict: 'assignment_id,stop_id' }).select().single();
    if (error) { toast(error.message, 'error'); throw error; }
    return data;
  };

  const checkGeo = () => new Promise((resolve) => {
    if (!navigator.geolocation || stop.lat == null) return resolve({ ok: true });
    navigator.geolocation.getCurrentPosition(
      (pos) => { const d = haversine({ lat: pos.coords.latitude, lng: pos.coords.longitude }, { lat: stop.lat, lng: stop.lng }); resolve({ ok: d <= CONFIG.ARRIVAL_RADIUS_M, dist: d, lat: pos.coords.latitude, lng: pos.coords.longitude }); },
      () => resolve({ ok: true, denied: true }), { enableHighAccuracy: true, timeout: 10000 }
    );
  });

  const doArrive = async () => {
    setBusy(true);
    try {
      const geo = await checkGeo();
      if (!geo.ok && !geo.denied) { if (!confirm(`Tu sembles à ${Math.round(geo.dist)} m du point (>${CONFIG.ARRIVAL_RADIUS_M} m). Valider quand même l'arrivée ?`)) { setBusy(false); return; } }
      if (stop.requires_photo && !photoBlob) { setBusy(false); setPhotoModal(true); return; }
      if (stop.requires_scan && !scanCode) { setBusy(false); setScanModal(true); return; }
      const now = new Date().toISOString();
      const l = await upsertLog({ status: 'completed', arrived_at: now, departed_at: now, lat_arrival: geo.lat, lng_arrival: geo.lng, distance_to_stop: geo.dist != null ? Math.round(geo.dist) : null, scan_code: scanCode || '' });
      if (photoBlob) await uploadPhoto(photoBlob, l.id, 'livraison');
      toast('Stop validé ✓', 'success'); onSaved(l);
    } catch (e) {} setBusy(false);
  };

  const uploadPhoto = async (blob, tourLogId, type) => {
    const path = `${profile.user_id}/${assignment.date}/${assignment.id}/${stop.id}/${uid()}.jpg`;
    const { error } = await sb.storage.from(CONFIG.PHOTO_BUCKET).upload(path, blob, { contentType: 'image/jpeg', upsert: true });
    if (error) { toast('Photo : ' + error.message, 'error'); return; }
    await sb.from('photos').insert({ tour_log_id: tourLogId, assignment_id: assignment.id, stop_id: stop.id, driver_id: profile.user_id, storage_path: path, file_size: blob.size, photo_type: type });
  };

  const submitProblem = async (issue) => {
    setBusy(true);
    try {
      const l = await upsertLog({ status: 'problem', arrived_at: new Date().toISOString(), issue_type: issue.type, issue_notes: issue.notes || '' });
      if (issue.blob) await uploadPhoto(issue.blob, l.id, 'probleme');
      toast('Problème signalé', 'success'); onSaved(l);
    } catch (e) {} setBusy(false); setProblemModal(false);
  };

  return (
    <div className="flex-1 flex flex-col">
      <div className="flex-1 p-4 space-y-4 overflow-y-auto pb-4">
        <div className="flex items-center justify-between">
          <div className="flex items-center gap-2 text-sm text-slate-400"><button onClick={onPrev} disabled={idx === 0} className="p-2 disabled:opacity-30"><Ico.left /></button>Stop {idx + 1} / {total}<button onClick={onNext} disabled={idx === total - 1} className="p-2 disabled:opacity-30"><Ico.right /></button></div>
          {completed && <Badge className={log.status === 'problem' ? 'bg-red-500/15 text-red-300' : 'bg-emerald-500/15 text-emerald-300'}>{log.status === 'problem' ? 'Problème' : 'Livré'}</Badge>}
        </div>

        <Card className="p-5">
          <div className="flex items-start gap-4">
            <div className="w-12 h-12 rounded-2xl flex items-center justify-center text-xl font-extrabold text-white flex-shrink-0" style={{ background: assignment.route_color }}>{idx + 1}</div>
            <div className="flex-1 min-w-0">
              {stop.scheduled_time && <div className="text-amber font-bold text-lg flex items-center gap-1.5"><Ico.clock size={18} />{fmtTime(stop.scheduled_time)}</div>}
              <div className="text-2xl font-extrabold leading-tight mt-0.5">{stop.client_name || 'Stop'}</div>
              <div className="text-slate-300 mt-1">{stop.address}</div>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-2 mt-4">
            <a href={navUrl} target="_blank" rel="noreferrer"><Btn className="w-full" size="lg"><Ico.nav size={18} /> Google Maps</Btn></a>
            <a href={wazeUrl} target="_blank" rel="noreferrer"><Btn variant="ghost" className="w-full" size="lg"><Ico.nav size={18} /> Waze</Btn></a>
          </div>
        </Card>

        {(stop.notes || stop.access_code || stop.parking_info || stop.operation_type) && (
          <Card className="p-4 space-y-2.5">
            {stop.operation_type && <Info icon={<Ico.pkg size={16} />} label="Opération" value={stop.operation_type} />}
            {stop.access_code && <Info icon={<Ico.cog size={16} />} label="Code d'accès" value={stop.access_code} accent />}
            {stop.parking_info && <Info icon={<Ico.truck size={16} />} label="Parking" value={stop.parking_info} />}
            {stop.notes && <Info icon={<Ico.list size={16} />} label="Notes" value={stop.notes} />}
          </Card>
        )}

        <div className="flex items-center gap-2 flex-wrap">
          {stop.requires_photo && <Badge className={cx('flex items-center gap-1', photoBlob || (log && log.status === 'completed') ? 'bg-emerald-500/15 text-emerald-300' : 'bg-brand/15 text-brand2')}><Ico.cam size={12} /> Photo {photoBlob ? '✓' : 'requise'}</Badge>}
          {stop.requires_scan && <Badge className={cx('flex items-center gap-1', scanCode ? 'bg-emerald-500/15 text-emerald-300' : 'bg-amber/15 text-amber')}><Ico.qr size={12} /> Scan {scanCode ? '✓' : 'requis'}</Badge>}
        </div>

        {stop.requires_photo && !completed && <Btn variant="outline" className="w-full" onClick={() => setPhotoModal(true)}><Ico.cam size={18} /> {photoBlob ? 'Reprendre la photo' : 'Prendre une photo'}</Btn>}
        {stop.requires_scan && !completed && <Btn variant="outline" className="w-full" onClick={() => setScanModal(true)}><Ico.qr size={18} /> {scanCode ? `Scanné : ${scanCode}` : 'Scanner l\'étiquette'}</Btn>}
      </div>

      {!completed ? (
        <div className="sticky bottom-0 bg-ink/95 backdrop-blur border-t border-line p-3 grid grid-cols-3 gap-2">
          <Btn variant="danger" size="lg" onClick={() => setProblemModal(true)} disabled={busy}><Ico.alert size={20} /> Problème</Btn>
          <Btn variant="ok" size="lg" className="col-span-2" onClick={doArrive} disabled={busy}>{busy ? <span className="w-5 h-5 border-2 border-white/40 border-t-white rounded-full spin" /> : <><Ico.check size={22} /> ARRIVÉ</>}</Btn>
        </div>
      ) : (
        <div className="sticky bottom-0 bg-ink/95 backdrop-blur border-t border-line p-3">
          <Btn className="w-full" size="lg" onClick={onNext} disabled={idx === total - 1}><Ico.right size={20} /> Stop suivant</Btn>
        </div>
      )}

      <PhotoModal open={photoModal} onClose={() => setPhotoModal(false)} onCapture={(b) => { setPhotoBlob(b); setPhotoModal(false); toast('Photo prête ✓', 'success'); }} />
      <ScanModal open={scanModal} onClose={() => setScanModal(false)} onScan={(c) => { setScanCode(c); setScanModal(false); toast('Scan : ' + c, 'success'); }} />
      <ProblemModal open={problemModal} onClose={() => setProblemModal(false)} onSubmit={submitProblem} busy={busy} />
    </div>
  );
}

const Info = ({ icon, label, value, accent }) => (
  <div className="flex items-start gap-2.5">
    <span className={cx('mt-0.5', accent ? 'text-amber' : 'text-slate-500')}>{icon}</span>
    <div className="min-w-0"><div className="text-[11px] text-slate-500 uppercase tracking-wide">{label}</div><div className={cx('text-sm', accent ? 'text-amber font-bold text-base' : 'text-slate-200')}>{value}</div></div>
  </div>
);

/* Compression + capture photo */
function compressImage(file, maxDim = 1280, quality = 0.7) {
  return new Promise((resolve) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > maxDim) { height = height * maxDim / width; width = maxDim; }
      else if (height > maxDim) { width = width * maxDim / height; height = maxDim; }
      const c = document.createElement('canvas'); c.width = width; c.height = height;
      c.getContext('2d').drawImage(img, 0, 0, width, height);
      c.toBlob((b) => { URL.revokeObjectURL(url); resolve(b); }, 'image/jpeg', quality);
    };
    img.onerror = () => resolve(file);
    img.src = url;
  });
}

function PhotoModal({ open, onClose, onCapture }) {
  const [preview, setPreview] = useState(null); const [busy, setBusy] = useState(false); const fileRef = useRef(null);
  useEffect(() => { if (open) { setPreview(null); setTimeout(() => fileRef.current && fileRef.current.click(), 100); } }, [open]);
  const onFile = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    setBusy(true); const blob = await compressImage(file);
    setPreview({ url: URL.createObjectURL(blob), blob }); setBusy(false);
  };
  return (
    <Modal open={open} onClose={onClose} title="Photo de preuve">
      <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={onFile} className="hidden" />
      {busy ? <Spinner label="Traitement…" /> : preview ? (
        <div className="space-y-3">
          <img src={preview.url} className="w-full rounded-xl" />
          <div className="grid grid-cols-2 gap-2">
            <Btn variant="ghost" onClick={() => fileRef.current && fileRef.current.click()}><Ico.cam size={18} /> Reprendre</Btn>
            <Btn variant="ok" onClick={() => onCapture(preview.blob)}><Ico.check size={18} /> Valider</Btn>
          </div>
        </div>
      ) : <Btn className="w-full" size="lg" onClick={() => fileRef.current && fileRef.current.click()}><Ico.cam size={20} /> Ouvrir la caméra</Btn>}
    </Modal>
  );
}

function ScanModal({ open, onClose, onScan }) {
  const videoRef = useRef(null); const [manual, setManual] = useState(''); const [err, setErr] = useState(''); const streamRef = useRef(null); const raf = useRef(null);
  useEffect(() => {
    if (!open) return;
    let detector, stopped = false;
    (async () => {
      if (!('BarcodeDetector' in window)) { setErr('Scanner auto non supporté — saisis le code manuellement.'); return; }
      try {
        detector = new window.BarcodeDetector();
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        streamRef.current = stream; if (videoRef.current) { videoRef.current.srcObject = stream; await videoRef.current.play(); }
        const tick = async () => {
          if (stopped) return;
          try { const codes = await detector.detect(videoRef.current); if (codes && codes.length) { cleanup(); onScan(codes[0].rawValue); return; } } catch (e) {}
          raf.current = requestAnimationFrame(tick);
        };
        tick();
      } catch (e) { setErr('Caméra indisponible — saisis le code manuellement.'); }
    })();
    const cleanup = () => { stopped = true; if (raf.current) cancelAnimationFrame(raf.current); if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop()); };
    return cleanup;
  }, [open]);
  return (
    <Modal open={open} onClose={onClose} title="Scanner l'étiquette">
      <div className="space-y-3">
        {!err && <div className="relative rounded-xl overflow-hidden bg-black aspect-square"><video ref={videoRef} className="w-full h-full object-cover" muted playsInline /><div className="absolute inset-8 border-2 border-brand2 rounded-xl pointer-events-none" /></div>}
        {err && <div className="text-sm text-amber bg-amber/10 border border-amber/20 rounded-xl px-3 py-2">{err}</div>}
        <Field label="Saisie manuelle"><div className="flex gap-2"><Input value={manual} onChange={(e) => setManual(e.target.value)} placeholder="Code-barres / QR" /><Btn onClick={() => manual && onScan(manual)}><Ico.check size={18} /></Btn></div></Field>
      </div>
    </Modal>
  );
}

function ProblemModal({ open, onClose, onSubmit, busy }) {
  const [type, setType] = useState(''); const [notes, setNotes] = useState(''); const [blob, setBlob] = useState(null); const fileRef = useRef(null);
  useEffect(() => { if (open) { setType(''); setNotes(''); setBlob(null); } }, [open]);
  const onFile = async (e) => { const f = e.target.files[0]; if (f) setBlob(await compressImage(f)); };
  return (
    <Modal open={open} onClose={onClose} title="Signaler un problème">
      <div className="space-y-3">
        <div className="grid grid-cols-1 gap-2">
          {ISSUES.map((it) => (
            <button key={it.id} onClick={() => setType(it.id)} className={cx('text-left px-4 py-3 rounded-xl font-semibold border transition flex items-center justify-between', type === it.id ? 'bg-bad/15 border-bad text-red-200' : 'bg-ink3/50 border-line text-slate-300')}>
              {it.label}{type === it.id && <Ico.check size={18} />}
            </button>
          ))}
        </div>
        {(type === 'autre' || type) && <Field label="Précisions (optionnel)"><Textarea value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Décris le problème…" /></Field>}
        <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={onFile} className="hidden" />
        <Btn variant="ghost" className="w-full" onClick={() => fileRef.current && fileRef.current.click()}><Ico.cam size={18} /> {blob ? 'Photo ajoutée ✓' : 'Ajouter une photo'}</Btn>
        <Btn variant="danger" size="lg" className="w-full" disabled={!type || busy} onClick={() => onSubmit({ type, notes, blob })}>{busy ? '…' : 'Confirmer le problème'}</Btn>
      </div>
    </Modal>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   ROOT
   ═══════════════════════════════════════════════════════════════════ */
function Root() {
  const { session, profile, loading } = useAuth();
  if (loading) return <Spinner label="Connexion…" />;
  if (!session) return <LoginScreen />;
  if (!profile) return (
    <div className="min-h-full flex items-center justify-center p-6 text-center">
      <div className="max-w-sm space-y-3">
        <div className="text-amber"><Ico.alert size={40} className="mx-auto" /></div>
        <h2 className="font-bold text-lg">Profil non configuré</h2>
        <p className="text-sm text-slate-400">Ton compte existe mais aucun profil n'est associé. L'administrateur doit créer ta fiche dans <span className="font-mono text-xs">users_profiles</span>.</p>
        <Btn variant="ghost" onClick={() => sb.auth.signOut()}>Se déconnecter</Btn>
      </div>
    </div>
  );
  return profile.role === 'admin' ? <AdminApp /> : <DriverApp />;
}

function App() {
  return <AuthProvider><ToastHost /><Root /></AuthProvider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

/* PWA — service worker */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
</script>
