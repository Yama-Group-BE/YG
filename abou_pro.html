const toEmail=id=>id.includes('@')?id.trim():id.trim().toLowerCase().replace(/\s+/g,'-')+'@aboupro.app';
const fmtDate=d=>d?new Date(d).toLocaleDateString('fr-FR'):'—';
const fmtTime=d=>d?new Date(d).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'—';
const todayStr=()=>new Date().toISOString().slice(0,10);
const haversine=(a,b,c,d)=>{const R=6371000,dL=(c-a)*Math.PI/180,dN=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dN/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));};
const VEH={pied:'🚶',velo:'🚲',voiture:'🚗',camionnette:'🚐',camion:'🚛'};

function useToast(){
  const[list,setList]=useState([]);
  const add=(msg,type='info')=>{const id=Date.now();setList(t=>[...t,{id,msg,type}]);setTimeout(()=>setList(t=>t.filter(x=>x.id!==id)),4200);};
  return{list,toast:add};
}
function Toasts({list}){
  const C={info:'#3b82f6',success:'#059669',error:'#dc2626',warning:'#d97706'};
  return <div style={{position:'fixed',bottom:16,right:16,zIndex:9999,display:'flex',flexDirection:'column',gap:8}}>
    {list.map(t=><div key={t.id} style={{background:C[t.type]||C.info,color:'white',padding:'10px 16px',borderRadius:10,fontSize:13,fontWeight:500,maxWidth:280,boxShadow:'0 4px 20px rgba(0,0,0,.4)'}}>{t.msg}</div>)}
  </div>;
}

async function geocode(addr){
  try{const r=await fetch(`https://api.openrouteservice.org/geocode/search?api_key=${ORS_KEY}&text=${encodeURIComponent(addr)}&size=1`);const d=await r.json();if(d.features?.length){const[lng,lat]=d.features[0].geometry.coordinates;return{lat,lng};}}catch{}
  return null;
}
async function optimizeStops(stops){
  const pts=stops.filter(s=>s.lat&&s.lng);
  if(pts.length<2)return stops;
  try{
    const jobs=pts.map((s,i)=>({id:i+1,location:[parseFloat(s.lng),parseFloat(s.lat)],service:300}));
    const body={jobs,vehicles:[{id:1,profile:'driving-car',start:jobs[0].location,end:jobs[0].location}]};
    const r=await fetch('https://api.openrouteservice.org/optimization',{method:'POST',headers:{'Authorization':ORS_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(d.routes?.[0]?.steps){const ord=d.routes[0].steps.filter(s=>s.type==='job').map(s=>s.id-1);return ord.map((i,idx)=>({...pts[i],order_index:idx}));}
  }catch{}
  const pool=[...pts],opt=[pool.shift()];
  while(pool.length){const last=opt[opt.length-1];let mi=Infinity,mx=0;pool.forEach((s,i)=>{const d2=haversine(last.lat,last.lng,s.lat,s.lng);if(d2<mi){mi=d2;mx=i;}});opt.push(pool.splice(mx,1)[0]);}
  return opt.map((s,i)=>({...s,order_index:i}));
}

function parseRows(rows){
  return rows.map(row=>{
    const get=(...cc)=>{for(const c of cc){const k=Object.keys(row).find(k=>k.toLowerCase().includes(c));if(k&&row[k])return String(row[k]).trim();}return'';};
    return{client_name:get('client','nom','name','destinataire','raison'),address:get('adresse','address','addr','rue','location','lieu','destination'),scheduled_time:get('heure','time','horaire','rdv'),notes:get('note','comment','remarque','info'),operation_type:get('type','operation')||'livraison'};
  }).filter(r=>r.address.length>2);
}
function parseText(txt){
  return txt.split('\n').filter(l=>l.trim()).map(line=>{const p=line.split(/[,;|\t]/);return{client_name:p.length>1?p[0].trim():'',address:p.length>1?p[1].trim():p[0].trim(),scheduled_time:p[2]?.trim()||'',notes:p[3]?.trim()||'',operation_type:'livraison'};}).filter(r=>r.address.length>2);
}

/* IMPORT PANEL */
function ImportPanel({routeId,onDone,toast}){
  const[tab,setTab]=useState('paste');const[text,setText]=useState('');const[preview,setPreview]=useState([]);const[busy,setBusy]=useState(false);
  const fileRef=useRef();
  const doPaste=()=>{const rows=parseText(text);setPreview(rows);if(!rows.length)toast('Aucune adresse détectée','warning');else toast(`${rows.length} arrêt(s) détecté(s)`,'info');};
  const doFile=async file=>{
    const ext=file.name.split('.').pop().toLowerCase();let rows=[];
    if(ext==='csv'){const txt=await file.text();rows=parseRows(Papa.parse(txt,{header:true,skipEmptyLines:true}).data);}
    else if(['xls','xlsx'].includes(ext)){const buf=await file.arrayBuffer();const wb=XLSX.read(buf);rows=parseRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}));}
    setPreview(rows);if(!rows.length)toast('Aucune adresse détectée','warning');else toast(`${rows.length} arrêt(s) détecté(s)`,'info');
  };
  const doImport=async()=>{
    if(!preview.length)return;setBusy(true);
    const{data:existing}=await sb.from('stops').select('order_index').eq('route_id',routeId).order('order_index',{ascending:false}).limit(1);
    let idx=existing?.[0]?.order_index!=null?existing[0].order_index+1:0;
    const rows=preview.map((s,i)=>({route_id:routeId,client_name:s.client_name||'',address:s.address,scheduled_time:s.scheduled_time||null,notes:s.notes||null,operation_type:['livraison','collecte','service','autre'].includes(s.operation_type)?s.operation_type:'livraison',order_index:idx+i}));
    const{error}=await sb.from('stops').insert(rows);
    if(error){toast(error.message,'error');setBusy(false);return;}
    await sb.from('routes').update({total_stops:idx+preview.length}).eq('id',routeId);
    toast(`${preview.length} arrêt(s) importé(s)`,'success');onDone();setBusy(false);
  };
  return<div className="card" style={{padding:20,marginBottom:16}}>
    <h3 style={{margin:'0 0 14px',fontWeight:600,color:'white',fontSize:15}}>📥 Importer des arrêts</h3>
    <div style={{display:'flex',gap:8,marginBottom:14}}>
      {['paste','file'].map(t=><button key={t} className="btn" onClick={()=>setTab(t)} style={{background:tab===t?'#3b82f6':'#1e293b',color:tab===t?'white':'#94a3b8',fontSize:13,padding:'6px 14px'}}>{t==='paste'?'📋 Coller du texte':'📁 Fichier CSV/Excel'}</button>)}
    </div>
    {tab==='paste'?<div><p style={{color:'#64748b',fontSize:12,margin:'0 0 6px'}}>Format: Client, Adresse, Heure, Notes (une ligne par arrêt)</p><textarea className="inp" style={{height:100,fontFamily:'monospace',fontSize:12,resize:'vertical'}} placeholder={"Jean Dupont, 12 rue de la Paix Paris, 09:00\nMarie Martin, 45 av Victor Hugo Lyon, 10:30"} value={text} onChange={e=>setText(e.target.value)}/><button className="btn bp" style={{marginTop:8,fontSize:13}} onClick={doPaste}>👁️ Prévisualiser</button></div>
    :<div><input ref={fileRef} type="file" accept=".csv,.xlsx,.xls" style={{display:'none'}} onChange={e=>e.target.files[0]&&doFile(e.target.files[0])}/><button className="btn bp" style={{fontSize:13}} onClick={()=>fileRef.current.click()}>📁 Choisir un fichier</button><p style={{color:'#475569',fontSize:12,margin:'8px 0 0'}}>Formats: CSV, XLSX, XLS</p></div>}
    {preview.length>0&&<div style={{marginTop:14}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}><span style={{fontSize:13,color:'#cbd5e1',fontWeight:500}}>{preview.length} arrêt(s) prêt(s)</span><button className="btn bgrn" style={{fontSize:13,padding:'6px 14px'}} onClick={doImport} disabled={busy}>{busy?<span className="spin">⏳</span>:'✅'} Importer</button></div>
      <div style={{maxHeight:180,overflowY:'auto',display:'flex',flexDirection:'column',gap:4}}>
        {preview.map((s,i)=><div key={i} style={{background:'#0f172a',borderRadius:8,padding:'7px 10px',fontSize:12}}><span style={{color:'#60a5fa',marginRight:6}}>{i+1}.</span>{s.client_name&&<span style={{color:'white'}}>{s.client_name} — </span>}<span style={{color:'#cbd5e1'}}>{s.address}</span>{s.scheduled_time&&<span style={{color:'#64748b',marginLeft:8}}>🕐 {s.scheduled_time}</span>}</div>)}
      </div>
    </div>}
  </div>;
}

/* ROUTES */
function RoutesManager({toast}){
  const[routes,setRoutes]=useState([]);const[sel,setSel]=useState(null);const[stops,setStops]=useState([]);const[showAdd,setShowAdd]=useState(false);const[showImport,setShowImport]=useState(false);const[form,setForm]=useState({name:'',color:'#3b82f6',description:''});const[geocoding,setGeocoding]=useState(false);const[optimizing,setOptimizing]=useState(false);
  useEffect(()=>{loadRoutes();},[]);
  useEffect(()=>{if(sel)loadStops(sel.id);},[sel]);
  const loadRoutes=async()=>{const{data}=await sb.from('routes').select('*').eq('is_archived',false).order('created_at',{ascending:false});setRoutes(data||[]);};
  const loadStops=async id=>{const{data}=await sb.from('stops').select('*').eq('route_id',id).order('order_index');setStops(data||[]);};
  const createRoute=async e=>{
    e.preventDefault();if(!form.name)return;
    const{data,error}=await sb.from('routes').insert({...form}).select().single();
    if(error)return toast(error.message,'error');
    toast('Route créée','success');setRoutes(r=>[data,...r]);setShowAdd(false);setForm({name:'',color:'#3b82f6',description:''});setSel(data);
  };

        </div>

          <div style={{display:'flex',alignItems:'center',gap:10}}><div style={{width:12,height:12,borderRadius:'50%',background:r.color,flexShrink:0}}/><div style={{flex:1,minWidth:0}}><div style={{fontWeight:500,color:'white',fontSize:14,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.name}</div><div style={{fontSize:11,color:'#64748b'}}>{r.total_stops} arrêts · {r.is_active?'actif':'inactif'}</div></div></div>
        </div>)}

/* ASSIGNMENTS */
function AssignmentsManager({toast}){
  const[date,setDate]=useState(todayStr());const[asgns,setAsgns]=useState([]);const[routes,setRoutes]=useState([]);const[drivers,setDrivers]=useState([]);const[showCreate,setShowCreate]=useState(false);const[form,setForm]=useState({route_id:'',driver_id:'',vehicle_type:'voiture',start_time:'',notes:''});

    const[{data:a},{data:r},{data:d}]=await Promise.all([sb.from('aboupro_assignments_view').select('*').eq('assigned_date',date).order('created_at'),sb.from('routes').select('id,name,color').eq('is_active',true).eq('is_archived',false),sb.from('users_profiles').select('id,identifier,full_name').eq('role','driver').eq('is_active',true)]);

    const{data:asgn,error}=await sb.from('assignments').insert({route_id:form.route_id,driver_id:form.driver_id,assigned_date:date,vehicle_type:form.vehicle_type,start_time:form.start_time||null,notes:form.notes||null,total_stops:stops?.length||0}).select().single();
    if(error)return toast(error.message,'error');

  const DN=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];

    <div style={{display:'flex',gap:4,overflowX:'auto',paddingBottom:4}}>
      {weekDays().map(d=>{const dd=new Date(d+'T12:00');return<button key={d} onClick={()=>setDate(d)} style={{flexShrink:0,display:'flex',flexDirection:'column',alignItems:'center',padding:'8px 12px',borderRadius:10,border:'none',cursor:'pointer',background:d===date?'#3b82f6':'#1e293b',color:d===date?'white':'#94a3b8',minWidth:52}}><span style={{fontSize:11}}>{DN[dd.getDay()]}</span><span style={{fontSize:20,fontWeight:700}}>{dd.getDate()}</span></button>;})}
    </div>
    {showCreate&&<div className="card" style={{padding:20}}>

        <select className="inp" value={form.route_id} onChange={e=>setForm({...form,route_id:e.target.value})} required><option value="">— Route —</option>{routes.map(r=><option key={r.id} value={r.id}>{r.name}</option>)}</select>
        <select className="inp" value={form.driver_id} onChange={e=>setForm({...form,driver_id:e.target.value})} required><option value="">— Chauffeur —</option>{drivers.map(d=><option key={d.id} value={d.id}>{d.identifier} — {d.full_name||d.identifier}</option>)}</select>
        <select className="inp" value={form.vehicle_type} onChange={e=>setForm({...form,vehicle_type:e.target.value})}>{Object.entries(VEH).map(([v,ic])=><option key={v} value={v}>{ic} {v.charAt(0).toUpperCase()+v.slice(1)}</option>)}</select>
        <input type="time" className="inp" value={form.start_time} onChange={e=>setForm({...form,start_time:e.target.value})}/>
        <textarea className="inp" style={{gridColumn:'1/-1',height:60,resize:'vertical',fontSize:13}} placeholder="Notes (optionnel)" value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})}/>
        <div style={{gridColumn:'1/-1',display:'flex',gap:8}}><button type="submit" className="btn bp" style={{fontSize:13}}>Créer</button><button type="button" className="btn bg2" style={{fontSize:13}} onClick={()=>setShowCreate(false)}>Annuler</button></div>

          <div style={{display:'flex',alignItems:'center',gap:8}}><span style={{background:s.bg,color:s.c,borderRadius:20,padding:'3px 10px',fontSize:12,fontWeight:500}}>{SL[a.status]||a.status}</span><button style={{background:'none',border:'none',cursor:'pointer',color:'#f87171',fontSize:14}} onClick={()=>deleteAsgn(a.id)}>🗑️</button></div>
        </div>
        {a.total_stops>0&&<div style={{marginTop:10}}><div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'#64748b',marginBottom:4}}><span>{a.done_stops}/{a.total_stops} arrêts · {a.problem_stops} problème(s)</span><span>{a.progress_pct}%</span></div><div style={{background:'#0f172a',borderRadius:4,height:6}}><div style={{background:'#3b82f6',height:6,borderRadius:4,transition:'width .4s',width:`${a.progress_pct}%`}}/></div></div>}
      </div>;})}
      {asgns.length===0&&<div style={{textAlign:'center',padding:'48px 0',color:'#475569'}}><div style={{fontSize:36,marginBottom:8}}>📋</div><p style={{margin:0}}>Aucune affectation pour cette date</p></div>}
    </div>
  </div>;
}

  const create=async e=>{
    e.preventDefault();if(!form.identifier||!form.password)return toast('Identifiant et code requis','warning');if(form.password.length<8)return toast('Code minimum 8 caractères','warning');

    if(e1){toast(e1.message,'error');setBusy(false);return;}

/* LIVE MAP */
function LiveMap(){
  const mapRef=useRef(null);const leafRef=useRef(null);const mkrsRef=useRef({});const[drivers,setDrivers]=useState([]);
  useEffect(()=>{
    if(!mapRef.current||leafRef.current)return;
    leafRef.current=L.map(mapRef.current,{zoomControl:true}).setView([48.8566,2.3522],11);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'© OSM © CARTO',maxZoom:19}).addTo(leafRef.current);
    loadPos();const t=setInterval(loadPos,15000);
    return()=>{clearInterval(t);leafRef.current?.remove();leafRef.current=null;};
  },[]);
  const loadPos=async()=>{
    const{data}=await sb.from('aboupro_driver_kpis').select('*').not('last_lat','is',null);
    if(!data)return;setDrivers(data);
    data.forEach(d=>{
      if(!d.last_lat||!d.last_lng)return;
      const ic=L.divIcon({html:`<div style="background:#3b82f6;color:white;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;border:2px solid white;box-shadow:0 2px 8px rgba(0,0,0,.5)">${d.driver_identifier?.slice(0,3)||'?'}</div>`,className:'',iconSize:[32,32],iconAnchor:[16,16]});
      if(mkrsRef.current[d.driver_id])mkrsRef.current[d.driver_id].setLatLng([d.last_lat,d.last_lng]);
      else mkrsRef.current[d.driver_id]=L.marker([d.last_lat,d.last_lng],{icon:ic}).addTo(leafRef.current).bindPopup(`<b>${d.driver_name||d.driver_identifier}</b><br>${fmtTime(d.last_position_at)}`);
    });
  };
  return<div className="fi" style={{display:'flex',flexDirection:'column',gap:16}}>
    <div style={{display:'flex',alignItems:'center',gap:10}}><h2 style={{fontSize:22,fontWeight:700,color:'white',margin:0}}>📍 Suivi en temps réel</h2><span style={{width:8,height:8,borderRadius:'50%',background:'#22c55e',display:'inline-block'}}/></div>
    <div className="card" style={{overflow:'hidden',height:460}}><div ref={mapRef} style={{width:'100%',height:'100%'}}/></div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:10}}>
      {drivers.map(d=><div key={d.driver_id} className="card" style={{padding:'12px 14px',display:'flex',alignItems:'center',gap:10}}>
        <div style={{width:36,height:36,borderRadius:'50%',background:'#1d4ed8',display:'flex',alignItems:'center',justifyContent:'center',color:'white',fontWeight:700,fontSize:12,flexShrink:0}}>{d.driver_identifier?.slice(0,2)}</div>
        <div style={{flex:1,minWidth:0}}><div style={{fontWeight:500,color:'white',fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{d.driver_name||d.driver_identifier}</div>{d.last_position_at&&<div style={{fontSize:11,color:'#64748b'}}>{fmtTime(d.last_position_at)}</div>}</div>
      </div>)}
      {drivers.length===0&&<p style={{color:'#475569',margin:0,gridColumn:'1/-1',textAlign:'center',padding:16}}>Aucun chauffeur localisé</p>}
    </div>
  </div>;
}

/* HISTORY */
function History(){
  const[from,setFrom]=useState(()=>{const d=new Date();d.setDate(d.getDate()-7);return d.toISOString().slice(0,10);});
  const[to,setTo]=useState(todayStr());const[data,setData]=useState([]);
  useEffect(()=>{load();},[from,to]);
  const load=async()=>{const{data}=await sb.from('aboupro_assignments_view').select('*').gte('assigned_date',from).lte('assigned_date',to).order('assigned_date',{ascending:false});setData(data||[]);};
  const stats=useMemo(()=>({total:data.length,done:data.filter(a=>a.status==='termine').length,incident:data.filter(a=>a.status==='incident').length,stops:data.reduce((s,a)=>s+(a.done_stops||0),0),km:data.reduce((s,a)=>s+(parseFloat(a.total_km)||0),0).toFixed(1)}),[data]);
  const SS={planifie:{bg:'#1e293b',c:'#94a3b8'},en_cours:{bg:'#1e3a8a',c:'#93c5fd'},termine:{bg:'#064e3b',c:'#6ee7b7'},incident:{bg:'#7f1d1d',c:'#fca5a5'},annule:{bg:'#1e293b',c:'#475569'}};
  return<div className="fi" style={{display:'flex',flexDirection:'column',gap:20}}>
    <h2 style={{fontSize:22,fontWeight:700,color:'white',margin:0}}>Historique & Analyses</h2>
    <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}><input type="date" className="inp" style={{width:'auto'}} value={from} onChange={e=>setFrom(e.target.value)}/><span style={{color:'#94a3b8'}}>→</span><input type="date" className="inp" style={{width:'auto'}} value={to} onChange={e=>setTo(e.target.value)}/></div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(120px,1fr))',gap:10}}>
      {[{l:'Tournées',v:stats.total,c:'#60a5fa'},{l:'Terminées',v:stats.done,c:'#34d399'},{l:'Incidents',v:stats.incident,c:'#f87171'},{l:'Livraisons',v:stats.stops,c:'#fbbf24'},{l:'Km parcourus',v:stats.km,c:'#a78bfa'}].map(s=><div key={s.l} className="card" style={{padding:'14px 10px',textAlign:'center'}}><div style={{fontSize:22,fontWeight:700,color:s.c}}>{s.v}</div><div style={{fontSize:11,color:'#64748b',marginTop:2}}>{s.l}</div></div>)}
    </div>
    <div className="card" style={{padding:0,overflow:'auto'}}>
      <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
        <thead><tr style={{borderBottom:'1px solid #334155'}}>{['Date','Chauffeur','Route','Statut','Progrès','Km'].map(h=><th key={h} style={{padding:'12px 14px',textAlign:'left',color:'#64748b',fontWeight:500,whiteSpace:'nowrap'}}>{h}</th>)}</tr></thead>
        <tbody>
          {data.map(a=>{const s=SS[a.status]||SS.planifie;return<tr key={a.id} style={{borderBottom:'1px solid #1e293b'}}>
            <td style={{padding:'10px 14px',color:'#94a3b8',whiteSpace:'nowrap'}}>{fmtDate(a.assigned_date)}</td>
            <td style={{padding:'10px 14px',color:'#e2e8f0'}}>{a.driver_identifier}</td>
            <td style={{padding:'10px 14px',color:'#e2e8f0',maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.route_name}</td>
            <td style={{padding:'10px 14px'}}><span style={{background:s.bg,color:s.c,borderRadius:16,padding:'3px 8px',fontSize:11}}>{a.status}</span></td>
            <td style={{padding:'10px 14px',color:'#94a3b8'}}>{a.done_stops}/{a.total_stops}</td>
            <td style={{padding:'10px 14px',color:'#94a3b8'}}>{a.total_km?`${a.total_km}km`:'—'}</td>
          </tr>;})}
        </tbody>
      </table>
      {data.length===0&&<p style={{textAlign:'center',color:'#475569',padding:'32px 0',margin:0}}>Aucune donnée pour cette période</p>}
    </div>
  </div>;
}

/* DRIVER APP */
function DriverApp({profile,session,onLogout,toast}){
  const[asgn,setAsgn]=useState(null);const[stops,setStops]=useState([]);const[view,setView]=useState('tour');const[sel,setSel]=useState(null);const[loading,setLoading]=useState(true);const[pos,setPos]=useState(null);
  const watchRef=useRef(null);const mapRef=useRef(null);const leafRef=useRef(null);
  useEffect(()=>{loadAsgn();startGPS();return()=>{if(watchRef.current)navigator.geolocation.clearWatch(watchRef.current);};},[]);
  useEffect(()=>{if(view==='map'&&mapRef.current&&!leafRef.current&&asgn)initMap();},[view,asgn]);
  const startGPS=()=>{if(!navigator.geolocation)return;watchRef.current=navigator.geolocation.watchPosition(p=>{const{latitude:lat,longitude:lng,accuracy}=p.coords;setPos({lat,lng,accuracy});},null,{enableHighAccuracy:true,maximumAge:10000,timeout:15000});};
  useEffect(()=>{
    if(pos&&asgn&&asgn.status==='en_cours'){
      const t=setTimeout(async()=>{try{await sb.from('driver_positions').upsert({driver_id:profile.id,assignment_id:asgn.id,lat:pos.lat,lng:pos.lng,accuracy_m:Math.round(pos.accuracy||0),recorded_at:new Date().toISOString()},{onConflict:'driver_id,recorded_at'});}catch{}},500);
      return()=>clearTimeout(t);
    }
  },[pos,asgn?.id,asgn?.status]);
  const loadAsgn=async()=>{
    const{data}=await sb.from('assignments').select('*,routes(id,name,color)').eq('driver_id',profile.id).eq('assigned_date',todayStr()).neq('status','annule').order('created_at').limit(1).maybeSingle();
    if(data){setAsgn(data);const{data:s}=await sb.from('assignment_stops').select('*,stops(id,client_name,address,lat,lng,scheduled_time,notes,access_code,parking_info,requires_photo,requires_scan,operation_type)').eq('assignment_id',data.id).order('order_index');setStops(s||[]);}
    setLoading(false);
  };
  const initMap=()=>{
    if(!mapRef.current||leafRef.current)return;
    const center=pos?[pos.lat,pos.lng]:[48.8566,2.3522];
    leafRef.current=L.map(mapRef.current).setView(center,13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(leafRef.current);
    stops.forEach((s,i)=>{if(!s.stops?.lat)return;const c=s.status==='done'?'#22c55e':s.status==='problem'?'#ef4444':'#3b82f6';L.marker([s.stops.lat,s.stops.lng],{icon:L.divIcon({html:`<div style="background:${c};color:white;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;border:2px solid white">${i+1}</div>`,className:'',iconSize:[24,24],iconAnchor:[12,12]})}).addTo(leafRef.current).bindPopup(`<b>${i+1}. ${s.stops.client_name}</b><br>${s.stops.address}`);});
    if(pos)L.circle([pos.lat,pos.lng],{radius:pos.accuracy,color:'#3b82f6',fillOpacity:.15}).addTo(leafRef.current);
  };
  const startTour=async()=>{
    if(asgn.status!=='planifie')return;
    await sb.from('assignments').update({status:'en_cours',started_at:new Date().toISOString()}).eq('id',asgn.id);
    await sb.from('tour_logs').insert({assignment_id:asgn.id,driver_id:profile.id,event_type:'tour_started',lat:pos?.lat,lng:pos?.lng});
    setAsgn(a=>({...a,status:'en_cours'}));toast('Tournée démarrée 🚀','success');
  };
  const completeTour=async()=>{
    const pending=stops.filter(s=>s.status==='pending').length;
    if(pending>0&&!confirm(`${pending} arrêt(s) en attente. Terminer quand même ?`))return;
    await sb.from('assignments').update({status:'termine',completed_at:new Date().toISOString()}).eq('id',asgn.id);
    await sb.from('tour_logs').insert({assignment_id:asgn.id,driver_id:profile.id,event_type:'tour_completed',lat:pos?.lat,lng:pos?.lng});
    setAsgn(a=>({...a,status:'termine'}));toast('Tournée terminée ! 🎉','success');
  };
  const markDone=async astop=>{
    const stop=astop.stops;
    if(!pos)return toast('GPS requis','warning');
    if(stop.lat&&stop.lng){const d=haversine(pos.lat,pos.lng,stop.lat,stop.lng);if(d>250)return toast(`Vous êtes à ${Math.round(d)}m (max 250m)`,'warning');}
    const now=new Date().toISOString();
    await sb.from('assignment_stops').update({status:'done',arrived_at:now,completed_at:now,lat_arrived:pos.lat,lng_arrived:pos.lng,distance_m:stop.lat?Math.round(haversine(pos.lat,pos.lng,stop.lat,stop.lng)):null}).eq('id',astop.id);
    await sb.from('tour_logs').insert({assignment_id:asgn.id,driver_id:profile.id,event_type:'stop_done',stop_id:stop.id,lat:pos.lat,lng:pos.lng});
    setStops(s=>s.map(x=>x.id===astop.id?{...x,status:'done'}:x));
    toast('Livraison validée ✓','success');setSel(null);setView('tour');
  };
  const markProblem=async(astop,type,notes)=>{
    const now=new Date().toISOString();
    await sb.from('assignment_stops').update({status:'problem',arrived_at:now,problem_type:type,problem_notes:notes,lat_arrived:pos?.lat,lng_arrived:pos?.lng}).eq('id',astop.id);
    await sb.from('tour_logs').insert({assignment_id:asgn.id,driver_id:profile.id,event_type:'stop_problem',stop_id:astop.stops?.id,payload:{type,notes},lat:pos?.lat,lng:pos?.lng});
    setStops(s=>s.map(x=>x.id===astop.id?{...x,status:'problem'}:x));
    toast('Problème signalé','warning');setSel(null);setView('tour');
  };
  if(loading)return<div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh'}}><span className="spin" style={{fontSize:36}}>⏳</span></div>;
  if(!asgn)return<div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:24,textAlign:'center'}}>
    <div style={{fontSize:48,marginBottom:12}}>📭</div><h2 style={{color:'white',margin:'0 0 8px'}}>Aucune tournée aujourd'hui</h2>
    <p style={{color:'#64748b',margin:'0 0 24px'}}>Pas d'affectation pour le {fmtDate(todayStr())}</p>
    <button className="btn bg2" onClick={onLogout}>Se déconnecter</button>
  </div>;
  const done=stops.filter(s=>s.status==='done').length;const probs=stops.filter(s=>s.status==='problem').length;const pct=stops.length>0?Math.round(done/stops.length*100):0;
  if(view==='stop'&&sel)return<StopDetail astop={sel} asgn={asgn} profile={profile} pos={pos} toast={toast} onDone={()=>markDone(sel)} onProblem={(t,n)=>markProblem(sel,t,n)} onBack={()=>{setSel(null);setView('tour');}}/>;
  return<div style={{minHeight:'100vh',display:'flex',flexDirection:'column',background:'#0b1120'}}>
    <div style={{background:'#0f172a',borderBottom:'1px solid #1e293b',padding:'12px 16px',flexShrink:0}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div><div style={{fontWeight:700,color:'white',fontSize:15}}>{asgn.routes?.name||'Tournée'}</div><div style={{fontSize:11,color:'#475569'}}>{profile.identifier} · {fmtDate(todayStr())}</div></div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>{pos&&<span style={{fontSize:11,color:'#34d399'}}>📍 GPS</span>}<button onClick={onLogout} style={{background:'none',border:'none',cursor:'pointer',color:'#64748b',fontSize:12}}>Quitter</button></div>
      </div>
      <div style={{marginTop:10}}><div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'#475569',marginBottom:4}}><span>{done}/{stops.length} · {probs} problème(s)</span><span>{pct}%</span></div><div style={{background:'#1e293b',borderRadius:4,height:6}}><div style={{background:'#3b82f6',height:6,borderRadius:4,transition:'width .4s',width:`${pct}%`}}/></div></div>
    </div>
    <div style={{display:'flex',borderBottom:'1px solid #1e293b',flexShrink:0}}>
      {[['tour','📋 Arrêts'],['map','🗺️ Carte']].map(([k,l])=><button key={k} onClick={()=>setView(k)} style={{flex:1,padding:'10px 0',fontSize:13,fontWeight:500,border:'none',cursor:'pointer',background:'transparent',borderBottom:view===k?'2px solid #3b82f6':'2px solid transparent',color:view===k?'#60a5fa':'#64748b'}}>{l}</button>)}
    </div>
    <div style={{flex:1,overflowY:'auto'}}>
      {view==='tour'&&<div style={{padding:12,display:'flex',flexDirection:'column',gap:8}}>
        {asgn.status==='planifie'&&<div className="card" style={{padding:16,textAlign:'center'}}><p style={{color:'#94a3b8',margin:'0 0 12px',fontSize:14}}>Tournée prête à démarrer</p><button className="btn bp" style={{width:'100%',padding:'14px 0',fontSize:16}} onClick={startTour}>🚀 Démarrer la tournée</button></div>}
        {asgn.status==='en_cours'&&stops.filter(s=>s.status==='pending').length===0&&<button className="btn bgrn" style={{width:'100%',padding:'14px 0',fontSize:16}} onClick={completeTour}>✅ Terminer la tournée</button>}
        {asgn.status==='termine'&&<div className="card" style={{padding:16,textAlign:'center',background:'#064e3b',borderColor:'#065f46'}}><div style={{fontSize:32,marginBottom:6}}>🎉</div><p style={{color:'#6ee7b7',fontWeight:600,margin:0}}>Tournée terminée !</p></div>}
        {stops.map((astop,i)=><DriverStopCard key={astop.id} astop={astop} idx={i} asgnStatus={asgn.status} onClick={()=>{if(asgn.status==='en_cours'){setSel(astop);setView('stop');}}}/>)}
      </div>}
      {view==='map'&&<div ref={mapRef} style={{width:'100%',height:'calc(100vh - 140px)'}}/>}
    </div>
  </div>;
}

function DriverStopCard({astop,idx,asgnStatus,onClick}){
  const s=astop.stops;
  const BC={pending:'#334155',done:'#065f46',problem:'#7f1d1d',skipped:'#92400e'}[astop.status]||'#334155';
  const BG={done:'rgba(6,95,70,.15)',problem:'rgba(127,29,29,.15)',skipped:'rgba(146,64,14,.15)'}[astop.status]||'#1e293b';
  const IC={pending:'⏳',done:'✅',problem:'❌',skipped:'⏭️'}[astop.status]||'⏳';
  if(asgnStatus==='planifie')return null;
  return<div onClick={onClick} style={{background:BG,border:`1px solid ${BC}`,borderRadius:10,padding:'12px 14px',cursor:asgnStatus==='en_cours'?'pointer':'default'}}>
    <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
      <div style={{width:24,height:24,background:'#334155',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:'#94a3b8',flexShrink:0}}>{idx+1}</div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}><span style={{fontWeight:500,color:'white',fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{s?.client_name||'Client'}</span><span style={{fontSize:18,marginLeft:8}}>{IC}</span></div>
        <p style={{color:'#64748b',fontSize:12,margin:'2px 0 0',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s?.address}</p>
        <div style={{display:'flex',gap:10,marginTop:4,fontSize:11,color:'#475569'}}>{s?.scheduled_time&&<span>🕐 {s.scheduled_time}</span>}{s?.access_code&&<span>🔑 {s.access_code}</span>}{s?.requires_photo&&<span>📷</span>}{s?.requires_scan&&<span>📲</span>}</div>
      </div>
    </div>
  </div>;
}

function StopDetail({astop,asgn,profile,pos,toast,onDone,onProblem,onBack}){
  const stop=astop.stops;const[showProb,setShowProb]=useState(false);const[probType,setProbType]=useState('absent');const[probNotes,setProbNotes]=useState('');const[uploading,setUploading]=useState(false);const[photoOk,setPhotoOk]=useState(astop.photo_taken);
  const photoRef=useRef();
  const dist=pos&&stop?.lat&&stop?.lng?Math.round(haversine(pos.lat,pos.lng,stop.lat,stop.lng)):null;
  const uploadPhoto=async file=>{
    setUploading(true);const path=`${profile.id}/${asgn.id}/${astop.id}_${Date.now()}.jpg`;
    const{error}=await sb.storage.from('abou-pro-photos').upload(path,file,{contentType:'image/jpeg'});
    if(!error){await sb.from('photos').insert({assignment_id:asgn.id,stop_id:stop?.id,driver_id:profile.id,storage_path:path,photo_type:'delivery'});await sb.from('assignment_stops').update({photo_taken:true}).eq('id',astop.id);setPhotoOk(true);toast('Photo uploadée ✓','success');}
    else toast(error.message,'error');setUploading(false);
  };
  if(astop.status!=='pending')return<div style={{minHeight:'100vh',display:'flex',flexDirection:'column',background:'#0b1120'}}>
    <div style={{padding:'12px 16px',borderBottom:'1px solid #1e293b',display:'flex',alignItems:'center',gap:10}}><button onClick={onBack} style={{background:'none',border:'none',cursor:'pointer',color:'#60a5fa',fontSize:16}}>← Retour</button><span style={{fontWeight:600,color:'white'}}>{stop?.client_name}</span></div>
    <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:24,textAlign:'center'}}><div style={{fontSize:56,marginBottom:12}}>{astop.status==='done'?'✅':'❌'}</div><p style={{color:'white',fontSize:18,fontWeight:600,margin:'0 0 8px'}}>{astop.status==='done'?'Livré':'Problème signalé'}</p>{astop.arrived_at&&<p style={{color:'#64748b',fontSize:13,margin:0}}>À {fmtTime(astop.arrived_at)}</p>}{astop.problem_notes&&<p style={{color:'#fca5a5',fontSize:13,marginTop:8}}>{astop.problem_notes}</p>}</div>
  </div>;
  return<div style={{minHeight:'100vh',display:'flex',flexDirection:'column',background:'#0b1120'}}>
    <div style={{padding:'12px 16px',borderBottom:'1px solid #1e293b',display:'flex',alignItems:'flex-start',gap:10,flexShrink:0}}>
      <button onClick={onBack} style={{background:'none',border:'none',cursor:'pointer',color:'#60a5fa',fontSize:16,marginTop:2}}>←</button>
      <div style={{flex:1}}><div style={{fontWeight:700,color:'white',fontSize:15}}>{stop?.client_name}</div><div style={{fontSize:12,color:'#64748b'}}>{stop?.address}</div></div>
    </div>
    <div style={{flex:1,overflowY:'auto',padding:14,display:'flex',flexDirection:'column',gap:12}}>
      <div className="card" style={{padding:14,display:'flex',flexDirection:'column',gap:6}}>
        {stop?.scheduled_time&&<div style={{fontSize:13,color:'#cbd5e1'}}>🕐 Heure prévue : {stop.scheduled_time}</div>}
        {stop?.access_code&&<div style={{fontSize:13,color:'#fbbf24'}}>🔑 Code accès : <strong>{stop.access_code}</strong></div>}
        {stop?.parking_info&&<div style={{fontSize:13,color:'#cbd5e1'}}>🅿️ Parking : {stop.parking_info}</div>}
        {stop?.notes&&<div style={{fontSize:13,color:'#93c5fd'}}>📝 {stop.notes}</div>}
        {dist!==null&&<div style={{fontSize:13,fontWeight:600,color:dist<=250?'#34d399':'#f87171'}}>📍 Distance : {dist}m {dist<=250?'✓ OK':'⚠️ Trop loin'}</div>}
      </div>
      {stop?.lat&&stop?.lng&&<a href={`https://www.google.com/maps/dir/?api=1&destination=${stop.lat},${stop.lng}`} target="_blank" rel="noreferrer" style={{background:'#1d4ed8',color:'white',borderRadius:10,padding:'12px 16px',textAlign:'center',textDecoration:'none',fontWeight:600,fontSize:14,display:'block'}}>🗺️ Naviguer vers cette adresse</a>}
      <div className="card" style={{padding:14}}>
        <div style={{fontSize:13,fontWeight:500,color:'#cbd5e1',marginBottom:8}}>📷 Photo de preuve {photoOk&&'✓'}</div>
        <input ref={photoRef} type="file" accept="image/*" capture="environment" style={{display:'none'}} onChange={e=>e.target.files[0]&&uploadPhoto(e.target.files[0])}/>
        <button className="btn bp" style={{width:'100%',fontSize:13,padding:'10px 0'}} onClick={()=>photoRef.current.click()} disabled={uploading}>{uploading?<span className="spin">⏳</span>:'📷'} {photoOk?'Reprendre une photo':'Prendre une photo'}</button>
      </div>
      {!showProb?<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <button className="btn bgrn" style={{padding:'18px 0',fontSize:18,borderRadius:14}} onClick={onDone}>✅ LIVRÉ</button>
        <button className="btn bred" style={{padding:'18px 0',fontSize:18,borderRadius:14}} onClick={()=>setShowProb(true)}>❌ PROBLÈME</button>
      </div>:<div className="card" style={{padding:14,display:'flex',flexDirection:'column',gap:10}}>
        <div style={{fontWeight:600,color:'white',fontSize:14}}>Signaler un problème</div>
        <select className="inp" value={probType} onChange={e=>setProbType(e.target.value)}>
          <option value="absent">Client absent</option><option value="adresse_incorrecte">Adresse incorrecte</option><option value="acces_impossible">Accès impossible</option><option value="colis_endommage">Colis endommagé</option><option value="refuse">Refus de livraison</option><option value="autre">Autre</option>
        </select>
        <textarea className="inp" style={{height:70,resize:'none',fontSize:13}} placeholder="Notes (optionnel)" value={probNotes} onChange={e=>setProbNotes(e.target.value)}/>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}><button className="btn bred" style={{padding:'12px 0'}} onClick={()=>onProblem(probType,probNotes)}>Confirmer</button><button className="btn bg2" style={{padding:'12px 0'}} onClick={()=>setShowProb(false)}>Annuler</button></div>
      </div>}
    </div>
  </div>;
}

/* ROOT */
function App(){
  const{list,toast}=useToast();const[auth,setAuth]=useState(null);const[firstRun,setFirstRun]=useState(false);
  useEffect(()=>{
    (async()=>{
      const{data:{session}}=await sb.auth.getSession();
      if(session)await loadProfile(session);
      else{try{const{data}=await sb.rpc('aboupro_has_admin');if(!data)setFirstRun(true);}catch{}setAuth(false);}
    })();
    const{data:{subscription}}=sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_OUT')setAuth(false);if(event==='SIGNED_IN'&&session)await loadProfile(session);});
    return()=>subscription.unsubscribe();
  },[]);
  const loadProfile=async session=>{
    const{data:profile,error}=await sb.from('users_profiles').select('*').eq('id',session.user.id).maybeSingle();
    if(error||!profile){toast('Profil introuvable. Contactez l\'administrateur.','error');await sb.auth.signOut();setAuth(false);return;}
    setAuth({session,user:session.user,profile});setFirstRun(false);
  };
  const handleLogin=async session=>await loadProfile(session);
  const handleLogout=async()=>{await sb.auth.signOut();setAuth(false);toast('Déconnecté','info');};
  useEffect(()=>{if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});},[]);
  if(auth===null)return<div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}><div style={{fontSize:52,marginBottom:12}} className="spin">🚚</div><p style={{color:'#475569',fontSize:14}}>Chargement…</p><Toasts list={list}/></div>;
  if(firstRun)return<><SetupScreen onDone={handleLogin} toast={toast}/><Toasts list={list}/></>;
  if(!auth)return<><LoginScreen onLogin={handleLogin} toast={toast}/><Toasts list={list}/></>;
  const{session,profile}=auth;
  if(profile.role==='admin')return<><AdminLayout profile={profile} session={session} onLogout={handleLogout} toast={toast}/><Toasts list={list}/></>;
  return<><DriverApp profile={profile} session={session} onLogout={handleLogout} toast={toast}/><Toasts list={list}/></>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
